  #crosshair{

    position:absolute; width:44px; height:44px; margin:-22px 0 0 -22px; border-radius:50%;

<script type="module">
import * as THREE from "three";

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('apartment-sw.js').catch(console.error);
}

/* ============================================================
   APP VERSION & UPDATED TIME
   ============================================================ */
const APP_VERSION = 'v2.8';
const BUILD_TIME = new Date('2026-08-16T12:00:00-04:00').getTime();

function formatRelativeTime(fromTime){
  const diffSec = Math.max(0, Math.floor((Date.now() - fromTime) / 1000));
  if (diffSec < 5) return 'just now';
  if (diffSec < 60) return `${diffSec}s ago`;
  const diffMin = Math.floor(diffSec / 60);
  if (diffMin < 60) return `${diffMin}m ago`;
  const diffHours = Math.floor(diffMin / 60);
  if (diffHours < 24) return `${diffHours}h ago`;
  const diffDays = Math.floor(diffHours / 24);
  return `${diffDays}d ago`;
}

function updateVersionDisplay(){
  const rel = formatRelativeTime(BUILD_TIME);
  const text = `${APP_VERSION} · Updated ${rel}`;
  const badgeEl = document.getElementById('version-text');
  if (badgeEl) badgeEl.textContent = text;
  const startEl = document.getElementById('start-version-text');
  if (startEl) startEl.textContent = text;
}
setInterval(updateVersionDisplay, 1000);
updateVersionDisplay();

/* ============================================================
   UTILITIES
   ============================================================ */
const lerp = (a,b,t) => a + (b-a)*t;
const clamp = (v,min,max) => Math.max(min, Math.min(max, v));
const rand = (min,max) => min + Math.random()*(max-min);
const pickArr = (arr) => arr[Math.floor(Math.random()*arr.length)];

/* ============================================================
   RENDERER / SCENE / CAMERA
   ============================================================ */
const canvas = document.getElementById('game-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.82;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(72, window.innerWidth/window.innerHeight, 0.05, 200);
const EYE_HEIGHT = 1.7;

function onResize(){
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
onResize();

/* ============================================================
   SHARED GEOMETRY / MATERIAL PALETTE
   ============================================================ */
const UNIT_BOX = new THREE.BoxGeometry(1,1,1);
const UNIT_CYL = new THREE.CylinderGeometry(1,1,1,12);
const UNIT_SPHERE = new THREE.SphereGeometry(1,10,8);

function box(w,h,d,mat,castShadow=true){
  const m = new THREE.Mesh(UNIT_BOX, mat);
  m.scale.set(w,h,d);
  m.castShadow = castShadow; m.receiveShadow = true;
  return m;
}
function cyl(rTop,rBot,h,mat,castShadow=true){
  if (Math.abs(rTop - rBot) < 0.001){
    const m = new THREE.Mesh(UNIT_CYL, mat);
    m.scale.set(rTop,h,rTop);
    m.castShadow = castShadow; m.receiveShadow = true;
    return m;
  }
  const geo = new THREE.CylinderGeometry(rTop,rBot,h,12);
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = castShadow; m.receiveShadow = true;
  return m;
}
function sph(r,mat,castShadow=true){
  const m = new THREE.Mesh(UNIT_SPHERE, mat);
  m.scale.setScalar(r);
  m.castShadow = castShadow; m.receiveShadow = true;
  return m;
}

const MAT = {
  wall: new THREE.MeshStandardMaterial({ color:0x3a3f4b, roughness:0.9 }),
  wallBedroom: new THREE.MeshStandardMaterial({ color:0x3a3550, roughness:0.9 }),
  floorWood: new THREE.MeshStandardMaterial({ color:0x4f3a2e, roughness:0.82 }),
  floorTile: new THREE.MeshStandardMaterial({ color:0x8a8f98, roughness:0.55 }),
  ceiling: new THREE.MeshStandardMaterial({ color:0x22252c, roughness:1 }),
  trim: new THREE.MeshStandardMaterial({ color:0xe8e4da, roughness:0.6 }),
  glass: new THREE.MeshPhysicalMaterial({ color:0x9fd4ff, roughness:0.08, transmission:0.35, transparent:true, opacity:0.2, depthWrite:false }),
  curtain: new THREE.MeshStandardMaterial({ color:0x6d3f4a, roughness:0.9, side:THREE.DoubleSide }),
  blackout: new THREE.MeshStandardMaterial({ color:0x11151d, roughness:0.98, side:THREE.DoubleSide }),
  sofa: new THREE.MeshStandardMaterial({ color:0x556b8a, roughness:0.85 }),
  sofaPillow: new THREE.MeshStandardMaterial({ color:0xd98b52, roughness:0.9 }),
  woodFurn: new THREE.MeshStandardMaterial({ color:0x8a5a34, roughness:0.65 }),
  woodDark: new THREE.MeshStandardMaterial({ color:0x4a3320, roughness:0.6 }),
  metal: new THREE.MeshStandardMaterial({ color:0x9aa0a8, roughness:0.35, metalness:0.6 }),
  metalDark: new THREE.MeshStandardMaterial({ color:0x2c2f34, roughness:0.4, metalness:0.5 }),
  fabricBed: new THREE.MeshStandardMaterial({ color:0x3f4f66, roughness:0.9 }),
  pillow: new THREE.MeshStandardMaterial({ color:0xe8e2d5, roughness:0.9 }),
  rug: new THREE.MeshStandardMaterial({ color:0x7a3f3f, roughness:0.95 }),
  rugBedroom: new THREE.MeshStandardMaterial({ color:0x3f5a4a, roughness:0.95 }),
  screenOff: new THREE.MeshBasicMaterial({ color:0x0c1420 }),
  lampShade: new THREE.MeshStandardMaterial({ color:0xf2d9a8, roughness:0.7, emissive:0x8a6a2c, emissiveIntensity:0.5 }),
  applianceWhite: new THREE.MeshStandardMaterial({ color:0xd9dde2, roughness:0.4, metalness:0.2 }),
  counterTop: new THREE.MeshStandardMaterial({ color:0x2c2f34, roughness:0.3 }),
  door: new THREE.MeshStandardMaterial({ color:0x5a3d2a, roughness:0.6 }),
  doorFrame: new THREE.MeshStandardMaterial({ color:0xe8e4da, roughness:0.6 }),
  book: [0x8a3a3a,0x3a5a8a,0x3a8a5a,0x8a7a3a,0x5a3a8a].map(c => new THREE.MeshStandardMaterial({color:c, roughness:0.8})),
  street: new THREE.MeshStandardMaterial({ color:0x14161b, roughness:0.35 }),
  sidewalk: new THREE.MeshStandardMaterial({ color:0x2c2e33, roughness:0.7 }),
  buildingFacade: new THREE.MeshStandardMaterial({ color:0x1c2027, roughness:0.85 }),
  houseFacade: new THREE.MeshStandardMaterial({ color:0xb7aa92, roughness:0.92 }),
  houseTrim: new THREE.MeshStandardMaterial({ color:0xe1d8c8, roughness:0.75 }),
  houseRoof: new THREE.MeshStandardMaterial({ color:0x302b31, roughness:0.88 }),
  guardSuit: new THREE.MeshStandardMaterial({ color:0x111823, roughness:0.78 }),
  guardShirt: new THREE.MeshStandardMaterial({ color:0xe7e9ec, roughness:0.72 }),
  guardTie: new THREE.MeshStandardMaterial({ color:0x651f28, roughness:0.68 }),
  guardSkin: new THREE.MeshStandardMaterial({ color:0x8f6047, roughness:0.86 }),
  buildingFar: new THREE.MeshStandardMaterial({ color:0x11141a, roughness:0.9 }),
  windowLit: new THREE.MeshBasicMaterial({ color:0xffdba0 }),
  carBody: new THREE.MeshStandardMaterial({ color:0x2a3a55, roughness:0.4, metalness:0.3 }),
  poleMat: new THREE.MeshStandardMaterial({ color:0x24262b, roughness:0.5, metalness:0.4 }),
  foliage: new THREE.MeshStandardMaterial({ color:0x244b35, roughness:0.95 }),
  foliageLight: new THREE.MeshStandardMaterial({ color:0x3f6a42, roughness:0.95 }),
  trunk: new THREE.MeshStandardMaterial({ color:0x4c3828, roughness:1 }),
  planter: new THREE.MeshStandardMaterial({ color:0x655447, roughness:0.9 }),
};

/* ============================================================
   COLLISION + GROUND HEIGHT (3D aware with min/max Y)
   ============================================================ */
const PLAYER_RADIUS = 0.42;
const STREET_Y = -3.5;

const APT   = { minX:-6.2, maxX:6.2, minZ:-5.2, maxZ:5.0 };
const LOBBY = { minX:-4.2, maxX:4.2, minZ:5.0,  maxZ:10.2 };
const STAIR = { minX:-4.2, maxX:-1.8, minZ:7.0, maxZ:10.0 };

function insideRect(x,z,r){ return x > r.minX && x < r.maxX && z > r.minZ && z < r.maxZ; }
function inStairCorridorX(x){ return x > STAIR.minX && x < STAIR.maxX; }

function groundHeightAt(x,z,currentY){
  if (inStairCorridorX(x) && z > STAIR.minZ && z < STAIR.maxZ){
    const t = clamp((z - STAIR.minZ) / (STAIR.maxZ - STAIR.minZ), 0, 1);
    return -3.5 * t;
  }
  if (inStairCorridorX(x) && z >= STAIR.maxZ) return STREET_Y;
  if (currentY !== undefined && currentY < -1.8){
    if (inStairCorridorX(x) && z > STAIR.minZ) return groundHeightAt(x,z);
    return STREET_Y;
  }
  if (insideRect(x,z,APT) || insideRect(x,z,LOBBY)) return 0;
  return STREET_Y;
}

function isIndoors(x,z,currentY){
  if (inStairCorridorX(x) && z >= STAIR.maxZ) return false;
  if (currentY !== undefined && currentY < -1.8 && z >= 9.6) return false;
  return insideRect(x,z,APT) || insideRect(x,z,LOBBY) || (inStairCorridorX(x) && z >= STAIR.minZ && z < STAIR.maxZ);
}

const colliders = []; // {minX,maxX,minZ,maxZ,minY,maxY}
function addCollider(minX,maxX,minZ,maxZ,minY=-10,maxY=10){
  colliders.push({minX,maxX,minZ,maxZ,minY,maxY});
}

function collidesAt(x,z,y=0){
  const r = PLAYER_RADIUS;
  for (const c of colliders){
    if (y >= c.minY && y <= c.maxY){
      if (x+r > c.minX && x-r < c.maxX && z+r > c.minZ && z-r < c.maxZ) return true;
    }
  }
  return false;
}

function resolveMove(pos, dx, dz){
  const playerY = pos.y - EYE_HEIGHT;
  const nx = pos.x + dx;
  if (!collidesAt(nx, pos.z, playerY)) pos.x = nx;
  const nz = pos.z + dz;
  if (!collidesAt(pos.x, nz, playerY)) pos.z = nz;
}

/* ============================================================
   WALL BUILDING (with window/door openings)
   ============================================================ */
const WALL_H = 3, WALL_T = 0.15;

function wallSegment(runAxis, fixed, from, to, yFrom, yTo, mat, group, thickness=WALL_T, floorY=0){
  const len = to - from;
  const h = yTo - yFrom;
  if (len <= 0.01 || h <= 0.01) return;
  const mesh = new THREE.Mesh(UNIT_BOX, mat);
  if (runAxis === 'z'){
    mesh.scale.set(thickness, h, len);
    mesh.position.set(fixed, floorY + yFrom + h/2, from + len/2);
    if (yFrom < 2.0) addCollider(fixed - thickness/2, fixed + thickness/2, from, to, floorY + yFrom, floorY + yTo);
  } else {
    mesh.scale.set(len, h, thickness);
    mesh.position.set(from + len/2, floorY + yFrom + h/2, fixed);
    if (yFrom < 2.0) addCollider(from, to, fixed - thickness/2, fixed + thickness/2, floorY + yFrom, floorY + yTo);
  }
  mesh.castShadow = true; mesh.receiveShadow = true;
  group.add(mesh);
}

function wallWithOpenings(runAxis, fixed, start, end, wallH, openings, mat, group, thickness=WALL_T, floorY=0){
  let cursor = start;
  for (const op of openings){
    if (op.from > cursor) wallSegment(runAxis, fixed, cursor, op.from, 0, wallH, mat, group, thickness, floorY);
    wallSegment(runAxis, fixed, op.from, op.to, 0, op.sillY, mat, group, thickness, floorY);
    wallSegment(runAxis, fixed, op.from, op.to, op.lintelY, wallH, mat, group, thickness, floorY);
    cursor = op.to;
  }
  if (cursor < end) wallSegment(runAxis, fixed, cursor, end, 0, wallH, mat, group, thickness, floorY);
}

function buildWindow(runAxis, fixed, center, width, sillY, topY, group){
  const w = new THREE.Group();
  const glassW = runAxis === 'z' ? 0.04 : width - 0.1;
  const glassD = runAxis === 'z' ? width - 0.1 : 0.04;
  const glass = new THREE.Mesh(UNIT_BOX, MAT.glass);
  glass.scale.set(glassW, topY - sillY - 0.1, glassD);
  if (runAxis === 'z') glass.position.set(fixed, (sillY+topY)/2, center);
  else glass.position.set(center, (sillY+topY)/2, fixed);
  w.add(glass);

  const mullionMat = MAT.trim;
  const mullionOffset = fixed < 0 ? 0.05 : -0.05;
  const vMul = box(0.05, topY-sillY-0.1, 0.05, mullionMat, false);
  if (runAxis === 'z'){ vMul.position.set(fixed + mullionOffset, (sillY+topY)/2, center); }
  else { vMul.position.set(center, (sillY+topY)/2, fixed + mullionOffset); }
  w.add(vMul);

  const curtainH = topY - sillY + 0.5;
  for (const side of [-1,1]){
    const cur = box(0.35, curtainH, 0.08, MAT.curtain, false);
    if (runAxis === 'z') cur.position.set(fixed + (fixed<0?0.12:-0.12), sillY + curtainH/2 - 0.2, center + side*(width/2+0.15));
    else cur.position.set(center + side*(width/2+0.15), sillY + curtainH/2 - 0.2, fixed + (fixed<0?0.12:-0.12));
    w.add(cur);
  }
  group.add(w);
}

/* ============================================================
   FURNITURE FACTORIES
   ============================================================ */
function makeSofa(){
  const g = new THREE.Group();
  const base = box(2.2,0.45,0.9,MAT.sofa); base.position.y = 0.22; g.add(base);
  const back = box(2.2,0.55,0.2,MAT.sofa); back.position.set(0,0.6,-0.35); g.add(back);
  const armL = box(0.22,0.55,0.9,MAT.sofa); armL.position.set(-1.09,0.55,0); g.add(armL);
  const armR = box(0.22,0.55,0.9,MAT.sofa); armR.position.set(1.09,0.55,0); g.add(armR);
  for (let i=-1;i<=1;i++){
    const pillow = box(0.4,0.25,0.25,MAT.sofaPillow); pillow.rotation.z = rand(-0.15,0.15);
    pillow.position.set(i*0.65, 0.55, -0.18); g.add(pillow);
  }
  return g;
}
function makeCoffeeTable(){
  const g = new THREE.Group();
  const top = box(1.1,0.06,0.6,MAT.woodDark); top.position.y = 0.4; g.add(top);
  for (const [sx,sz] of [[-0.48,-0.24],[0.48,-0.24],[-0.48,0.24],[0.48,0.24]]){
    const leg = box(0.06,0.4,0.06,MAT.woodDark); leg.position.set(sx,0.2,sz); g.add(leg);
  }
  return g;
}
function makeTVUnit(){
  const g = new THREE.Group();
  const stand = box(1.4,0.45,0.4,MAT.woodDark); stand.position.y = 0.22; g.add(stand);
  const tv = box(1.2,0.7,0.06,MAT.screenOff); tv.position.y = 0.85; g.add(tv);
  const tvGlow = new THREE.Mesh(new THREE.PlaneGeometry(1.1,0.62), new THREE.MeshBasicMaterial({color:0x3a6fa8}));
  tvGlow.position.set(0,0.85,0.035); g.add(tvGlow);
  return g;
}
function makeBookshelf(){
  const g = new THREE.Group();
  const frame = box(1.0,1.8,0.3,MAT.woodDark); frame.position.y = 0.9; g.add(frame);
  const shelfInset = box(0.9,1.6,0.02,new THREE.MeshStandardMaterial({color:0x1a140e}),false);
  // Keep the backing visibly in front of the cabinet face. Its old front face
  // was exactly coplanar with the frame, which caused motion-dependent flicker.
  shelfInset.position.set(0,0.9,0.165); g.add(shelfInset);
  for (let row=0; row<3; row++){
    let cx = -0.4;
    const n = 5;
    for (let i=0;i<n;i++){
      const bw = rand(0.06,0.09);
      const bh = rand(0.32,0.42);
      const bMesh = box(bw,bh,0.22, pickArr(MAT.book));
      bMesh.position.set(cx+bw/2, 0.35+row*0.5, 0.1);

function buildLobby(){
  const g = new THREE.Group(); worldGroup.add(g);

  // Foyer floor with a real stairwell opening.
  const mainFloor = box(LOBBY.maxX - STAIR.maxX, 0.1, LOBBY.maxZ - LOBBY.minZ, MAT.floorTile);
  mainFloor.position.set((STAIR.maxX + LOBBY.maxX)/2, -0.05, (LOBBY.minZ + LOBBY.maxZ)/2);
  g.add(mainFloor);
  const stairLanding = box(STAIR.maxX - STAIR.minX, 0.1, STAIR.minZ - LOBBY.minZ, MAT.floorTile);
  stairLanding.position.set((STAIR.minX + STAIR.maxX)/2, -0.05, (LOBBY.minZ + STAIR.minZ)/2);
  g.add(stairLanding);
  const lobbyCeiling = box(LOBBY.maxX - LOBBY.minX, 0.1, LOBBY.maxZ - LOBBY.minZ, MAT.ceiling, false);
  lobbyCeiling.position.set((LOBBY.minX + LOBBY.maxX)/2, WALL_H + 0.05, (LOBBY.minZ + LOBBY.maxZ)/2);
  g.add(lobbyCeiling);

  // Side walls of lobby
  wallWithOpenings('z', LOBBY.maxX, LOBBY.minZ, LOBBY.maxZ, WALL_H, [], MAT.wall, g, WALL_T, 0);
  wallWithOpenings('z', LOBBY.minX, LOBBY.minZ, LOBBY.maxZ, WALL_H, [], MAT.wall, g, WALL_T, 0);

  // Full-height stairwell walls continue below lobby level and prevent the
  // stairs from reading as an exposed hole beside the foyer.
  const stairOuterWall = box(0.14, 3.5, STAIR.maxZ - STAIR.minZ, MAT.wall, false);
  stairOuterWall.position.set(STAIR.minX, -1.75, (STAIR.minZ + STAIR.maxZ)/2); g.add(stairOuterWall);
  const stairDivider = box(0.14, 6.5, STAIR.maxZ - STAIR.minZ, MAT.wall, false);
  stairDivider.position.set(STAIR.maxX, -0.25, (STAIR.minZ + STAIR.maxZ)/2); g.add(stairDivider);
  addCollider(STAIR.maxX-0.08, STAIR.maxX+0.08, STAIR.minZ, STAIR.maxZ, -4.0, 3.0);

  // A continuous back wall keeps the foyer enclosed beneath the house roofline.
  wallSegment('x', LOBBY.maxZ, STAIR.maxX, LOBBY.maxX, 0, WALL_H, MAT.wall, g, WALL_T, 0);

  // Foyer ceiling light
  const lobbyShade = cyl(0.28,0.28,0.1,MAT.lampShade,false); lobbyShade.position.set(0,2.75,7.5); g.add(lobbyShade);
  const lobbyLight = new THREE.PointLight(0xfff0d0, 60, 10, 2); lobbyLight.position.set(0,2.6,7.5); g.add(lobbyLight);

  // ---- Staircase ----
  const STEPS = 14, STEP_H = 3.5/STEPS, STEP_D = (STAIR.maxZ - STAIR.minZ)/STEPS;
  for (let i=0;i<STEPS;i++){
    const stepY = -STEP_H*(i+1);
    const stepZ = STAIR.minZ + STEP_D*i;
    const step = box(2.2, STEP_H+0.05, STEP_D+0.02, MAT.floorTile);
    step.position.set(-3.0, stepY + STEP_H/2, stepZ + STEP_D/2);
    g.add(step);
  }
  for (const railX of [-3.95, -2.05]){
    for (let i=0;i<=STEPS;i+=2){
      const railY = -STEP_H*i + 0.9;
      const railZ = STAIR.minZ + STEP_D*i;
      const post = cyl(0.02,0.02,0.9,MAT.metalDark,false);
      post.position.set(railX, railY-0.45, railZ);
      g.add(post);
    }
    const railTop = box(0.04,0.04,STAIR.maxZ-STAIR.minZ+0.2,MAT.metalDark,false);
    railTop.position.set(railX, -1.75+0.9, (STAIR.minZ+STAIR.maxZ)/2);
    railTop.rotation.x = Math.atan2(3.5, STAIR.maxZ-STAIR.minZ);
    g.add(railTop);
  }

  const stairLight = new THREE.PointLight(0xffe6c8, 26, 7, 2);
  stairLight.position.set(-3.0, 1.8, 8.2); g.add(stairLight);

  return g;
}

function makeStreetTree(scale=1){
  const tree = new THREE.Group();
  const trunk = cyl(0.13*scale,0.18*scale,1.7*scale,MAT.trunk,false);
  trunk.position.y = 0.85*scale; tree.add(trunk);
  for (const [x,y,z,s] of [[0,1.9,0,0.72],[-0.34,1.65,0.05,0.52],[0.35,1.68,-0.04,0.56],[0.05,2.35,0,0.55]]){

    crown.position.set(x*scale,y*scale,z*scale); crown.castShadow = true; tree.add(crown);
  }

function makeTrafficCar(color,dir){
  const car = new THREE.Group();
  const fadeMaterials = [];
  const paint = new THREE.MeshStandardMaterial({ color, roughness:0.34, metalness:0.45, transparent:true });
  const glass = new THREE.MeshStandardMaterial({ color:0x172536, roughness:0.18, metalness:0.3, transparent:true });
  const tire = MAT.metalDark.clone(); tire.transparent = true;
  const lamp = new THREE.MeshBasicMaterial({ color:dir>0?0xfff0c8:0xff4438, transparent:true });
  fadeMaterials.push(paint,glass,tire,lamp);
  const body = box(4.15,0.62,1.72,paint,false); body.position.y = 0.58; car.add(body);
  const cabin = box(2.12,0.58,1.5,glass,false); cabin.position.set(-0.18*dir,1.15,0); car.add(cabin);
  for (const [x,z] of [[-1.3,-0.82],[1.3,-0.82],[-1.3,0.82],[1.3,0.82]]){
    const wheel = cyl(0.36,0.36,0.22,tire,false); wheel.rotation.x = Math.PI/2; wheel.position.set(x,0.35,z); car.add(wheel);
  }
  for (const z of [-0.29,0.29]){
    const light = box(0.04,0.16,0.22,lamp,false); light.position.set(dir*2.09,0.65,z*2.25); car.add(light);
  }
  car.userData = { dir, speed:rand(5.2,7.4), fadeMaterials };
  return car;
}

function buildFarWindows(buildings){
  const geo = new THREE.PlaneGeometry(0.4,0.5);
  const total = buildings.length * 24;
  const inst = new THREE.InstancedMesh(geo, MAT.windowLit, total);
  const m = new THREE.Matrix4();
  let idx = 0;
  for (const b of buildings){
    for (let i=0;i<24;i++){
      const lit = Math.random() < 0.35;
      const x = b.x + rand(-b.w/2+0.4, b.w/2-0.4);
      const y = b.y + rand(0.6, b.h-0.6);
      m.makeTranslation(x,y,b.z + b.d/2 + 0.02);
      if (!lit) m.scale(new THREE.Vector3(0.001,0.001,0.001));
      inst.setMatrixAt(idx, m);
      idx++;
    }
  }
  inst.instanceMatrix.needsUpdate = true;
  outdoorGroup.add(inst);
}

function updateTraffic(dt){
  for (const car of trafficCars){
    car.position.x += car.userData.dir*car.userData.speed*dt;
    const edgeFade = 1-clamp((Math.abs(car.position.x)-36)/10,0,1);
    for (const material of car.userData.fadeMaterials) material.opacity = edgeFade;
    if (car.userData.dir>0 && car.position.x>48) car.position.x=-48;
    if (car.userData.dir<0 && car.position.x<-48) car.position.x=48;
  }
}

function updateWindowRain(dt){
  const arr = windowRainGeo.attributes.position.array;
  for (let i=0;i<WINDOW_RAIN_COUNT;i++){

    arr[p+1] -= fall;

    }

let audioCtx = null;
function ensureAudio(){
  if (!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  if (audioCtx.state==='suspended') audioCtx.resume();
}

let rainAmbGain = null;
function startRainAmbience(){
  ensureAudio();
  const bufferSize = audioCtx.sampleRate * 2;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  let last = 0;
  for (let i=0;i<bufferSize;i++){
    const white = Math.random()*2-1;
    last = (last + 0.02*white) / 1.02;
    data[i] = last * 3.2;
  }
  const src = audioCtx.createBufferSource();
  src.buffer = buffer; src.loop = true;
  const filter = audioCtx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value = 1200;
  rainAmbGain = audioCtx.createGain(); rainAmbGain.gain.value = 0;
  src.connect(filter); filter.connect(rainAmbGain); rainAmbGain.connect(audioCtx.destination);
  src.start();
}

function playThunder(vol = 0.5){
  if (!audioCtx) return;
  const bufferSize = audioCtx.sampleRate * 1.2;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i=0;i<bufferSize;i++) data[i] = (Math.random()*2-1) * Math.pow(1 - i/bufferSize, 2);
  const src = audioCtx.createBufferSource(); src.buffer = buffer;
  const filter = audioCtx.createBiquadFilter(); filter.type='lowpass'; filter.frequency.value = 400;
  const gain = audioCtx.createGain(); gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime+1.1);
  src.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  src.start();
}

const flashEl = document.getElementById('cine-flash');
let lightningTimer = rand(2.0, 4.5);
let stormVisible = true;

function flashOnce(delayMs, holdMs, peak){
  setTimeout(() => {
    if (!stormVisible) return;
    flashEl.style.transition = 'none';
    flashEl.style.opacity = String(peak);
    moonLight.intensity = 22;
    setTimeout(() => {
      flashEl.style.transition = 'opacity .4s ease';
      flashEl.style.opacity = '0';
      moonLight.intensity = BASE_MOON_INTENSITY;
    }, holdMs);
  }, delayMs);
}

function updateLightning(dt, outside){
  stormVisible = outside;
  if (!outside){
    flashEl.style.opacity = '0';
    moonLight.intensity = BASE_MOON_INTENSITY;
  }
  lightningTimer -= dt;
  if (lightningTimer <= 0){
    lightningTimer = rand(3.5, 7.5);
    if (outside){
      const peak = 0.92;
      flashOnce(0, 90, peak);
      if (Math.random() < 0.6) flashOnce(140, 70, peak * 0.7);
      if (Math.random() < 0.3) flashOnce(260, 60, peak * 0.85);
    }

    const thunderVol = outside ? 0.42 : 0.12;
    playThunder(thunderVol);
    setTimeout(() => playThunder(thunderVol * 0.8), rand(180, 500));
  }
}

/* ============================================================
   INPUT: keyboard, mouse look (pointer lock), touch
   ============================================================ */
const keys = new Set();
window.addEventListener('keydown', (e) => { keys.add(e.code); if (e.code==='KeyE' && !e.repeat) tryInteract(); });
window.addEventListener('keyup', (e) => keys.delete(e.code));

let yaw = Math.PI, pitch = -0.05;
const MOUSE_SENS = 0.0022, TOUCH_SENS = 0.0032;

function applyLook(){
  pitch = clamp(pitch, -1.2, 1.2);
  camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
}

document.addEventListener('mousemove', (e) => {
  if (document.pointerLockElement !== canvas) return;
  yaw -= e.movementX * MOUSE_SENS;
  pitch -= e.movementY * MOUSE_SENS;
});

canvas.addEventListener('click', () => {
  if (gameStarted) canvas.requestPointerLock();
});

/* ---- touch joystick (move) + drag look ---- */
const touchMoveEl = document.getElementById('touch-move');
const touchLookEl = document.getElementById('touch-look');
const joyBase = document.getElementById('joystick-base');
const joyKnob = document.getElementById('joystick-knob');
let moveVec = { x:0, y:0 };
let moveTouchId = null, lookTouchId = null, lookLast = null;

touchMoveEl.addEventListener('touchstart', (e) => {
  if (moveTouchId !== null) return;
  const t = e.changedTouches[0];
  moveTouchId = t.identifier;
  joyBase.style.display = 'block';
  joyBase.style.left = (t.clientX - 48) + 'px';
  joyBase.style.top = (t.clientY - 48) + 'px';
  joyKnob.style.left = '50%'; joyKnob.style.top = '50%';
}, { passive:true });

touchMoveEl.addEventListener('touchmove', (e) => {
  for (const t of e.changedTouches){
    if (t.identifier !== moveTouchId) continue;
    const rect = joyBase.getBoundingClientRect();
    const cx = rect.left + 48, cy = rect.top + 48;
    let dx = t.clientX - cx, dy = t.clientY - cy;
    const dist = Math.min(48, Math.hypot(dx,dy));
    const ang = Math.atan2(dy,dx);
    dx = Math.cos(ang)*dist; dy = Math.sin(ang)*dist;
    joyKnob.style.left = (48+dx) + 'px'; joyKnob.style.top = (48+dy) + 'px';
    moveVec.x = dx/48; moveVec.y = dy/48;
  }
}, { passive:true });

function endMoveTouch(e){
  for (const t of e.changedTouches){
    if (t.identifier !== moveTouchId) continue;
    moveTouchId = null; moveVec.x = 0; moveVec.y = 0; joyBase.style.display = 'none';
  }
}
touchMoveEl.addEventListener('touchend', endMoveTouch);
touchMoveEl.addEventListener('touchcancel', endMoveTouch);

touchLookEl.addEventListener('touchstart', (e) => {
  if (lookTouchId !== null) return;
  const t = e.changedTouches[0];
  lookTouchId = t.identifier;
  lookLast = { x:t.clientX, y:t.clientY };
}, { passive:true });

touchLookEl.addEventListener('touchmove', (e) => {
  for (const t of e.changedTouches){
    if (t.identifier !== lookTouchId) continue;
    const dx = t.clientX - lookLast.x, dy = t.clientY - lookLast.y;
    lookLast = { x:t.clientX, y:t.clientY };
    yaw -= dx * TOUCH_SENS * 2.5;
    pitch -= dy * TOUCH_SENS * 2.5;
  }
}, { passive:true });

function endLookTouch(e){
  for (const t of e.changedTouches){
    if (t.identifier === lookTouchId){
      lookTouchId = null;
      lookLast = null;
    }
  }
}
touchLookEl.addEventListener('touchend', endLookTouch);
touchLookEl.addEventListener('touchcancel', endLookTouch);

document.getElementById('touch-interact-btn').addEventListener('click', tryInteract);

/* ============================================================
   INTERACT SYSTEM
   ============================================================ */
const promptEl = document.getElementById('interact-prompt');
const touchInteractBtn = document.getElementById('touch-interact-btn');
const captionEl = document.getElementById('closed-caption');
let currentInteractable = null;
let captionTimer = 0;

function nearestGuard(px,pz){
  let nearest = null, nearestDist = Infinity;
  for (const guard of guards){
    const distance = Math.hypot(px-guard.position.x,pz-guard.position.z);
    if (distance < nearestDist){ nearest = guard; nearestDist = distance; }
  }
  return nearestDist <= 3.4 ? nearest : null;
}

function updateInteractPrompt(px, pz, py){
  const guard = py < -1.5 ? nearestGuard(px,pz) : null;
  currentInteractable = guard ? { type:'guard', guard } : null;
  promptEl.classList.toggle('show', Boolean(guard));
  if (guard) promptEl.textContent = 'Press E or USE to speak with security';
  if (touchInteractBtn){
    touchInteractBtn.classList.toggle('active', Boolean(guard));
    if (('ontouchstart' in window) || navigator.maxTouchPoints > 0) touchInteractBtn.style.display = guard ? 'flex' : 'none';
  }
}

function selectGuardVoice(){
  const voices = window.speechSynthesis?.getVoices?.() || [];
  const preferred = [
    /Microsoft.*(Guy|Ryan|Andrew).*Natural/i,
    /Microsoft.*Natural/i,
    /(Guy|Ryan|Andrew|David)/i,
    /Google US English/i,
    /English.*United States/i
  ];
  for (const pattern of preferred){
    const voice = voices.find(v => /^en(-|_)/i.test(v.lang) && pattern.test(v.name));
    if (voice) return voice;
  }
  return voices.find(v => /^en-US/i.test(v.lang)) || voices.find(v => /^en/i.test(v.lang)) || null;
}

function speakGuard(guard){
  const line = 'Perimeter secured. Enjoy your day.';
  guard.userData.lookUntil = performance.now() + 4800;
  captionEl.innerHTML = `<span class="speaker">SECURITY</span>${line}`;
  captionEl.classList.add('show');
  clearTimeout(captionTimer);

  if ('speechSynthesis' in window){
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(line);
    const voice = selectGuardVoice();
    if (voice) utterance.voice = voice;
    utterance.lang = voice?.lang || 'en-US';
    utterance.rate = 0.92;
    utterance.pitch = 0.88;
    utterance.volume = 1;
    utterance.onend = () => { captionTimer = setTimeout(() => captionEl.classList.remove('show'), 650); };
    utterance.onerror = () => { captionTimer = setTimeout(() => captionEl.classList.remove('show'), 3200); };
    window.speechSynthesis.speak(utterance);
  } else {
    captionTimer = setTimeout(() => captionEl.classList.remove('show'), 3600);
  }
}

function tryInteract(){
  if (currentInteractable?.type === 'guard') speakGuard(currentInteractable.guard);
}

function updateGuards(dt){
  const now = performance.now();
  for (const guard of guards){
    const target = now < guard.userData.lookUntil
      ? Math.atan2(player.pos.x-guard.position.x,player.pos.z-guard.position.z)
      : guard.userData.restYaw;
    const delta = Math.atan2(Math.sin(target-guard.rotation.y),Math.cos(target-guard.rotation.y));
    guard.rotation.y += delta * Math.min(1,dt*6);
  }
}

const debugEl = document.getElementById('debug-readout');
const debugRaycaster = new THREE.Raycaster();
const debugLookPoint = new THREE.Vector3();
const debugLookDirection = new THREE.Vector3();

function zoneNameAt(x,z,y){
  if (inStairCorridorX(x) && z > STAIR.minZ && z < STAIR.maxZ) return 'stairs';
  if (inStairCorridorX(x) && z >= STAIR.maxZ) return 'street (stairs exit)';
  if (insideRect(x,z,APT)){
    if (y !== undefined && y < -1.5) return 'street';
    if (x > 0.3 && z < -0.5) return 'bedroom';
    if (x > 0.3 && z >= -0.5) return 'kitchen';
    return 'living room';
  }
  if (insideRect(x,z,LOBBY)){
    if (y !== undefined && y < -1.5) return 'street (canopy)';
    return 'lobby';
  }
  return 'street';
}

/* ============================================================
   BUILD WORLD
   ============================================================ */
buildApartment();
buildFrontDoor();
buildLobby();
buildOutdoor();

// Keep practical fixtures warm without letting overlapping point lights flatten
// the low-poly forms into orange-white blocks.
scene.traverse((object) => {
  if (object.isPointLight) object.intensity *= 0.48;
});

/* ============================================================
   PLAYER INITIALIZATION
   ============================================================ */
const player = { pos: new THREE.Vector3(-2.2, EYE_HEIGHT, -0.5) };
camera.position.copy(player.pos);
applyLook();

/* ============================================================
   START / FLOW (Direct Load — Scene Opened Immediately)
   ============================================================ */
let gameStarted = true;

const hasTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if (hasTouch){
  touchMoveEl.style.pointerEvents = 'auto';
  touchLookEl.style.pointerEvents = 'auto';
}

function initAudioOnFirstInteraction(){
  ensureAudio();
  startRainAmbience();
  window.removeEventListener('pointerdown', initAudioOnFirstInteraction);
  window.removeEventListener('keydown', initAudioOnFirstInteraction);
  window.removeEventListener('touchstart', initAudioOnFirstInteraction);
}
window.addEventListener('pointerdown', initAudioOnFirstInteraction, { passive: true });
window.addEventListener('keydown', initAudioOnFirstInteraction, { passive: true });
window.addEventListener('touchstart', initAudioOnFirstInteraction, { passive: true });

/* ============================================================
   MAIN LOOP
   ============================================================ */
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (gameStarted){
    applyLook();

    let inX = 0, inZ = 0;
    if (keys.has('KeyW')) inZ -= 1;
    if (keys.has('KeyS')) inZ += 1;
    if (keys.has('KeyA')) inX -= 1;
    if (keys.has('KeyD')) inX += 1;
    inX += moveVec.x; inZ += moveVec.y;
    const len = Math.hypot(inX,inZ);
    if (len > 0.001){
      inX /= Math.max(len,1); inZ /= Math.max(len,1);
      const speed = 3.6;
      const sinY = Math.sin(yaw), cosY = Math.cos(yaw);
      const dx = (inX*cosY + inZ*sinY) * speed * dt;
      const dz = (inZ*cosY - inX*sinY) * speed * dt;
      resolveMove(player.pos, dx, dz);
    }

    const groundY = groundHeightAt(player.pos.x, player.pos.z, player.pos.y - EYE_HEIGHT);
    player.pos.y = lerp(player.pos.y, groundY + EYE_HEIGHT, Math.min(1, dt*10));
    camera.position.copy(player.pos);

    updateInteractPrompt(player.pos.x, player.pos.z, player.pos.y - EYE_HEIGHT);
    updateGuards(dt);
    updateTraffic(dt);

    const outside = !isIndoors(player.pos.x, player.pos.z, player.pos.y - EYE_HEIGHT);
    rainPoints.visible = outside;
    windowRainLines.visible = !outside;
    updateRain(dt, player.pos.x, player.pos.z);
    updateWindowRain(dt);
    updateLightning(dt, outside);
    scene.fog.near = outside ? 8 : 20;
    scene.fog.far = outside ? 40 : 60;
    if (rainAmbGain){
      const target = outside ? 0.4 : 0.03;
      rainAmbGain.gain.value = lerp(rainAmbGain.gain.value, target, dt*2);
    }

    const angleDeg = ((yaw * 180 / Math.PI) % 360 + 360) % 360;
    const isInsideApt = insideRect(player.pos.x, player.pos.z, APT) && (player.pos.y - EYE_HEIGHT >= -1.0);
    const hintEl = document.getElementById('hint-line');
    if (hintEl){
      if (isInsideApt){
        if (angleDeg >= 135 && angleDeg < 225){
          hintEl.textContent = '🟢 Facing North · [Front doorway and foyer straight ahead ➔]';
        } else if (angleDeg >= 225 && angleDeg < 315){
          hintEl.textContent = '🧭 Facing West · [Turn Right for Front Doorway]';
        } else if (angleDeg >= 45 && angleDeg < 135){
          hintEl.textContent = '🧭 Facing East · [Turn Left for Front Doorway]';
        } else {
          hintEl.textContent = '🧭 Facing South (TV) · [Turn around 180° for Front Doorway ➔]';
        }
      } else if (insideRect(player.pos.x, player.pos.z, LOBBY) && (player.pos.y - EYE_HEIGHT >= -1.0)){
        hintEl.textContent = '🏠 In Foyer · [Main stairs on the left]';
      } else {
        hintEl.textContent = '🌧️ Street Level · [Guarded main entrance and stairs ahead]';
      }
    }

    debugRaycaster.setFromCamera({ x:0, y:0 }, camera);
    const lookHits = debugRaycaster.intersectObject(worldGroup, true);
    if (lookHits.length){
      debugLookPoint.copy(lookHits[0].point);
    } else {
      camera.getWorldDirection(debugLookDirection);
      debugLookPoint.copy(camera.position).addScaledVector(debugLookDirection, 30);
    }
    const zone = zoneNameAt(player.pos.x, player.pos.z, player.pos.y - EYE_HEIGHT);
    debugEl.textContent = `YOU x=${player.pos.x.toFixed(2)} y=${player.pos.y.toFixed(2)} z=${player.pos.z.toFixed(2)} · LOOK x=${debugLookPoint.x.toFixed(2)} y=${debugLookPoint.y.toFixed(2)} z=${debugLookPoint.z.toFixed(2)} · ${zone} · yaw=${(yaw*180/Math.PI).toFixed(0)}° pitch=${(pitch*180/Math.PI).toFixed(0)}°`;
  }

  renderer.render(scene, camera);
}
animate();
</script>
