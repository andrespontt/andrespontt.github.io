<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>🎧 Perfect Pitch - Andres Pontt</title>
  <meta name="description" content="Train your ear to recognize musical notes by pitch, with easy/medium/hard modes.">
  <meta name="theme-color" content="#000000">
  <style>
    :root {
      color-scheme: dark;
      --bg: #000000;
      --card: #1c1c1e;
      --card-2: #2c2c2e;
      --separator: rgba(84, 84, 88, .48);
      --label: #ffffff;
      --label-2: rgba(235, 235, 245, .6);
      --label-3: rgba(235, 235, 245, .3);
      --blue: #0a84ff;
      --blue-tint: rgba(10, 132, 255, .17);
      --green: #30d158;
      --red: #ff453a;
      --fill: rgba(120, 120, 128, .24);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--label);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    button, select { font: inherit; cursor: pointer; color: inherit; }

    /* iOS-style press feedback: dim + settle instead of a hover color change */
    .pressable {
      transition: opacity .1s ease, transform .1s ease;
    }
    .pressable:active {
      opacity: .55;
      transform: scale(.97);
    }

    .screen {
      width: 100%;
      max-width: 560px;
      padding: max(20px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    }

    /* ── Large title nav bar ─────────────────── */
    .nav-bar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .title-row { display: flex; align-items: center; gap: 10px; min-width: 0; }

    .large-title {
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0;
    }

    .nav-icon-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--card);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      flex-shrink: 0;
      margin-top: 4px;
    }

    .subtitle-stats {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      color: var(--label-2);
      font-size: .9rem;
      margin: 2px 0 22px;
    }

    .subtitle-stats strong { color: var(--label); font-weight: 600; }

    /* ── Grouped card ────────────────────────── */
    .group {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 16px;
    }

    .feedback {
      min-height: 20px;
      text-align: center;
      font-weight: 600;
      color: var(--label-2);
      font-size: .95rem;
    }

    .feedback.good { color: var(--green); }
    .feedback.bad { color: var(--red); }

    .section-label {
      font-size: .78rem;
      font-weight: 600;
      color: var(--label-2);
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .note-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 6px;
    }

    .note-btn {
      border: none;
      background: var(--card-2);
      color: var(--label);
      border-radius: 10px;
      padding: 12px 4px;
      font-weight: 700;
      font-size: .92rem;
      text-align: center;
    }

    .note-btn.active { background: var(--blue); color: #fff; }

    .octave-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .octave-row.hidden { display: none; }

    .octave-label { font-size: .82rem; color: var(--label-2); margin-right: 4px; }

    .octave-btn {
      border: none;
      background: var(--card-2);
      color: var(--label);
      width: 38px;
      height: 38px;
      border-radius: 10px;
      font-weight: 700;
    }

    .octave-btn.active { background: var(--blue); color: #fff; }

    .actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 12px 22px;
      border-radius: 999px;
      font-weight: 600;
      font-size: .95rem;
    }

    .btn.filled { background: var(--blue); color: #fff; }
    .btn.tinted { background: var(--blue-tint); color: var(--blue); }
    .btn.hidden { display: none; }

    .hint {
      text-align: center;
      font-size: .75rem;
      color: var(--label-3);
    }

    /* ── Segmented control ───────────────────── */
    .field { display: flex; flex-direction: column; gap: 8px; }
    .field .field-label { font-size: .8rem; color: var(--label-2); }

    .segmented {
      display: flex;
      background: var(--fill);
      border-radius: 9px;
      padding: 2px;
      gap: 2px;
    }

    .segment {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--label-2);
      padding: 7px 4px;
      border-radius: 7px;
      font-weight: 600;
      font-size: .88rem;
      text-align: center;
    }

    .segment.active {
      background: #636366;
      color: #fff;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .4);
    }

    /* ── iOS-style slider ────────────────────── */
    .slider-row { display: flex; align-items: center; gap: 12px; }
    .slider-row span { font-size: 1.05rem; flex-shrink: 0; }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      height: 4px;
      border-radius: 2px;
      background: var(--fill);
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .4);
      border: none;
    }

    input[type="range"]::-moz-range-thumb {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .4);
      border: none;
    }

    .volume-number-wrap {
      display: flex;
      align-items: center;
      gap: 3px;
      flex-shrink: 0;
      color: var(--label-2);
      font-size: .9rem;
    }

    .volume-number {
      -moz-appearance: textfield;
      appearance: textfield;
      width: 42px;
      background: var(--card-2);
      border: none;
      border-radius: 8px;
      color: var(--label);
      padding: 5px 4px;
      text-align: center;
      font-weight: 600;
      font-size: .9rem;
    }

    .volume-number::-webkit-outer-spin-button,
    .volume-number::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    /* ── Settings bottom sheet ───────────────── */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease;
    }

    .sheet-backdrop.show { opacity: 1; pointer-events: auto; }

    .sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 21;
      background: var(--card);
      border-radius: 20px 20px 0 0;
      padding: 10px 20px max(20px, env(safe-area-inset-bottom));
      transform: translateY(100%);
      transition: transform .3s cubic-bezier(.2, .8, .2, 1);
      max-width: 560px;
      margin: 0 auto;
    }

    .sheet.show { transform: translateY(0); }

    .sheet-grabber {
      width: 36px;
      height: 5px;
      border-radius: 3px;
      background: var(--label-3);
      margin: 6px auto 14px;
    }

    .sheet-title {
      font-size: 1.2rem;
      font-weight: 700;
      text-align: center;
      margin: 0 0 18px;
    }

    .sheet-fields { display: flex; flex-direction: column; gap: 18px; margin-bottom: 22px; }

    .sheet-done {
      width: 100%;
      border: none;
      background: var(--blue);
      color: #fff;
      font-weight: 700;
      font-size: 1rem;
      padding: 14px;
      border-radius: 14px;
    }

    @media (max-width: 400px) {
      .subtitle-stats { display: none; }
      .large-title { font-size: 1.8rem; }
      .note-btn { padding: 10px 2px; font-size: .82rem; }
    }
  </style>
</head>
<body>

  <div class="screen">
    <div class="nav-bar">
      <div class="title-row">
        <a href="index.html" class="nav-icon-btn pressable" title="Back to Apps" style="text-decoration:none; font-size:1.3rem;">‹</a>
        <h1 class="large-title">Perfect Pitch</h1>
      </div>
      <button id="settingsToggle" class="nav-icon-btn pressable" title="Settings">⚙️</button>
    </div>
    <div class="subtitle-stats">
      <span>Score <strong id="score">0</strong></span>
      <span>Streak <strong id="streak">0</strong> (best <strong id="best">0</strong>)</span>
      <span>Attempts <strong id="attempts">0</strong></span>
    </div>

    <div class="group">
      <div id="feedback" class="feedback" role="status" aria-live="polite"></div>

      <div>
        <div class="section-label" style="margin-bottom:8px">Pick the note</div>
        <div id="noteGrid" class="note-grid"></div>
      </div>

      <div id="octaveRow" class="octave-row hidden">
        <span class="octave-label">Octave</span>
        <button class="octave-btn pressable" data-oct="2">2</button>
        <button class="octave-btn pressable" data-oct="3">3</button>
        <button class="octave-btn pressable" data-oct="4">4</button>
        <button class="octave-btn pressable" data-oct="5">5</button>
        <button class="octave-btn pressable" data-oct="6">6</button>
        <button id="submit" class="btn filled pressable hidden">Submit</button>
      </div>

      <div class="actions">
        <button id="play" class="btn filled pressable" title="Play note (Space)">▶️ Play</button>
        <button id="next" class="btn tinted pressable" title="Next note">⏭️ Next</button>
        <button id="refA" class="btn tinted pressable" title="Play reference A">🎵 Ref A</button>
      </div>

      <div class="hint">Space = Play · A–G = pick note · 2–6 = octave (Hard) · Enter = Submit</div>
    </div>
  </div>

  <div id="sheetBackdrop" class="sheet-backdrop"></div>
  <div id="sheet" class="sheet">
    <div class="sheet-grabber"></div>
    <h2 class="sheet-title">Settings</h2>
    <div class="sheet-fields">
      <div class="field">
        <span class="field-label">Difficulty</span>
        <div class="segmented" id="difficultySeg">
          <button class="segment" data-value="easy">Easy</button>
          <button class="segment" data-value="medium">Medium</button>
          <button class="segment" data-value="hard">Hard</button>
        </div>
      </div>
      <div class="field">
        <span class="field-label">Scale</span>
        <div class="segmented" id="scaleSeg">
          <button class="segment" data-value="normal">Diatonic</button>
          <button class="segment" data-value="complex">Chromatic</button>
        </div>
      </div>
      <div class="field">
        <span class="field-label">Tuning</span>
        <div class="segmented" id="tuningSeg">
          <button class="segment" data-value="440">A4 = 440 Hz</button>
          <button class="segment" data-value="432">A4 = 432 Hz</button>
        </div>
      </div>
      <div class="field">
        <span class="field-label">Volume</span>
        <div class="slider-row">
          <span>🔈</span>
          <input type="range" id="volumeSlider" min="0" max="100" step="1" value="100" aria-label="Volume">
          <span>🔊</span>
          <div class="volume-number-wrap">
            <input type="number" id="volumeNumber" class="volume-number" min="0" max="100" step="1" value="100" aria-label="Volume percent">
            <span>%</span>
          </div>
        </div>
      </div>
    </div>
    <button id="sheetDone" class="sheet-done pressable">Done</button>
  </div>

  <script>
    // ===== Data =====
    const NORMAL_NOTES = ['C','D','E','F','G','A','B'];
    const CHROMATIC_NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

    const SAVE_KEY = 'perfect_pitch_settings_v1';

    // ===== Audio =====
    let ctx = null;
    let osc = null, osc2 = null, gain = null;
    let current = { note: 'A', octave: 4, freq: 440 };
    let settings = { difficulty: 'easy', scale: 'normal', tuning: 440, volume: 100 };
    const PEAK_GAIN = 1.0; // max safe headroom for a single sine tone before digital clipping
    let state = { score:0, streak:0, best:0, attempts:0, selectedNote:null, selectedOctave:null };

    function ensureCtx(){ if(!ctx) ctx = new (window.AudioContext||window.webkitAudioContext)(); if(ctx.state==='suspended') ctx.resume(); }
    function playFreq(freq, dur=1.2){
      ensureCtx(); stopTone();
      gain = ctx.createGain(); gain.connect(ctx.destination);

      osc = ctx.createOscillator(); osc.type = 'sine'; osc.frequency.value = freq; osc.connect(gain);

      // A soft true-octave harmonic (2x freq) adds body/perceived loudness
      // without changing which note is heard — it's the same note's own
      // overtone, the way a real instrument's tone is never a bare sine.
      const harmGain = ctx.createGain(); harmGain.gain.value = 0.28; harmGain.connect(gain);
      osc2 = ctx.createOscillator(); osc2.type = 'sine'; osc2.frequency.value = freq * 2; osc2.connect(harmGain);

      const peakGain = PEAK_GAIN * (settings.volume / 100);
      const now = ctx.currentTime;
      const releaseStart = Math.max(now + 0.02, now + dur - 0.18);
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(peakGain, now + 0.02);   // quick attack
      gain.gain.setValueAtTime(peakGain, releaseStart);          // hold at full volume
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur); // short release tail

      osc.start(now); osc.stop(now + dur + 0.05);
      osc2.start(now); osc2.stop(now + dur + 0.05);
    }
    function stopTone(){ try{ if(osc){ osc.disconnect(); osc = null; } if(osc2){ osc2.disconnect(); osc2 = null; } if(gain){ gain.disconnect(); gain = null; } }catch(e){} }

    // ===== Utils =====
    function load(){ try{ const raw = localStorage.getItem(SAVE_KEY); if(raw){ const s = JSON.parse(raw); settings = { ...settings, ...s }; } }catch(e){} }
    function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(settings)); }catch(e){} }
    function noteIndex(note){ return CHROMATIC_NOTES.indexOf(note); }
    function freqFor(note, octave, A4){
      // Equal temperament relative to A4
      const nIndex = noteIndex(note); // 0..11 where C=0
      if(nIndex<0) return A4;
      // Semitone distance from C to A is +9. So position of note in octave relative to A is nIndex - 9.
      const semisFromA4 = (octave - 4)*12 + (nIndex - 9);
      return A4 * Math.pow(2, semisFromA4/12);
    }
    function pickRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

    // ===== DOM =====
    const els = {
      play: document.getElementById('play'),
      next: document.getElementById('next'),
      refA: document.getElementById('refA'),
      noteGrid: document.getElementById('noteGrid'),
      octaveRow: document.getElementById('octaveRow'),
      submit: document.getElementById('submit'),
      feedback: document.getElementById('feedback'),
      score: document.getElementById('score'),
      streak: document.getElementById('streak'),
      best: document.getElementById('best'),
      attempts: document.getElementById('attempts'),
      settingsToggle: document.getElementById('settingsToggle'),
      sheet: document.getElementById('sheet'),
      sheetBackdrop: document.getElementById('sheetBackdrop'),
      sheetDone: document.getElementById('sheetDone'),
      difficultySeg: document.getElementById('difficultySeg'),
      scaleSeg: document.getElementById('scaleSeg'),
      tuningSeg: document.getElementById('tuningSeg'),
      volumeSlider: document.getElementById('volumeSlider'),
      volumeNumber: document.getElementById('volumeNumber'),
    };

    function buildNoteGrid(){
      const pool = (settings.scale === 'normal') ? NORMAL_NOTES : CHROMATIC_NOTES;
      els.noteGrid.innerHTML = '';
      els.noteGrid.style.gridTemplateColumns = `repeat(${pool.length}, minmax(0,1fr))`;
      pool.forEach(n=>{
        const btn = document.createElement('button');
        btn.className = 'note-btn pressable';
        btn.textContent = n;
        btn.dataset.note = n;
        btn.addEventListener('click', ()=> selectNote(n));
        els.noteGrid.appendChild(btn);
      });
    }

    function selectNote(n){ state.selectedNote = n; document.querySelectorAll('.note-btn').forEach(b=>b.classList.toggle('active', b.dataset.note===n)); if(settings.difficulty==='hard'){ els.submit.classList.remove('hidden'); } else { checkGuess(); } }
    function selectOctave(o){ state.selectedOctave = Number(o); document.querySelectorAll('.octave-btn').forEach(b=>b.classList.toggle('active', Number(b.dataset.oct)===state.selectedOctave)); }

    // ===== Segmented controls =====
    function setSegmentedValue(container, value){
      container.querySelectorAll('.segment').forEach(b => b.classList.toggle('active', b.dataset.value === String(value)));
    }
    function wireSegmented(container, onChange){
      container.querySelectorAll('.segment').forEach(btn => {
        btn.addEventListener('click', () => {
          setSegmentedValue(container, btn.dataset.value);
          onChange(btn.dataset.value);
        });
      });
    }

    function applySettingsToUI(){
      setSegmentedValue(els.difficultySeg, settings.difficulty);
      setSegmentedValue(els.scaleSeg, settings.scale);
      setSegmentedValue(els.tuningSeg, String(settings.tuning));
      els.volumeSlider.value = settings.volume;
      els.volumeNumber.value = settings.volume;
      els.octaveRow.classList.toggle('hidden', settings.difficulty!=='hard');
    }

    function updateHud(){ els.score.textContent = state.score; els.streak.textContent = state.streak; els.best.textContent = state.best; els.attempts.textContent = state.attempts; }

    function pickNote(){
      const pool = (settings.scale === 'normal') ? NORMAL_NOTES : CHROMATIC_NOTES;
      const note = pickRandom(pool);
      const octavesEasy = [4];
      const octavesMed = [3,4,5];
      const octavesHard = [3,4,5,6];
      const octave = settings.difficulty==='easy' ? pickRandom(octavesEasy) : settings.difficulty==='medium' ? pickRandom(octavesMed) : pickRandom(octavesHard);
      const freq = freqFor(note, octave, settings.tuning);
      current = { note, octave, freq };
      state.selectedNote = null; state.selectedOctave = null;
      document.querySelectorAll('.note-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.octave-btn').forEach(b=>b.classList.remove('active'));
      els.submit.classList.add('hidden');
      els.feedback.textContent = '';
      els.feedback.className = 'feedback';
    }

    function playCurrent(){ playFreq(current.freq); }
    function playRefA(){ playFreq(settings.tuning, 1.0); }

    function checkGuess(){
      if(!state.selectedNote){ els.feedback.textContent = 'Pick a note'; return; }
      let correct = state.selectedNote === current.note;
      if(settings.difficulty==='hard'){
        if(state.selectedOctave == null){ els.feedback.textContent = 'Select an octave'; return; }
        correct = correct && (Number(state.selectedOctave) === current.octave);
      }
      state.attempts += 1;
      if(correct){
        state.score += (settings.difficulty==='hard') ? 20 : (settings.difficulty==='medium' ? 12 : 8);
        state.streak += 1; state.best = Math.max(state.best, state.streak);
        els.feedback.textContent = `Correct! ${current.note}${settings.difficulty==='hard' ? current.octave : ''} (${current.freq.toFixed(2)} Hz)`;
        els.feedback.className = 'feedback good';
        setTimeout(()=>{ nextRound(); }, 900);
      } else {
        state.streak = 0;
        els.feedback.textContent = 'Try again';
        els.feedback.className = 'feedback bad';
      }
      updateHud();
    }

    function nextRound(){ pickNote(); playCurrent(); updateHud(); }

    // ===== Events =====
    els.play.addEventListener('click', ()=>{ ensureCtx(); playCurrent(); });
    els.next.addEventListener('click', ()=>{ nextRound(); });
    els.refA.addEventListener('click', playRefA);

    document.querySelectorAll('.octave-btn').forEach(b=> b.addEventListener('click', ()=>{ selectOctave(b.dataset.oct); if(settings.difficulty!=='hard'){ checkGuess(); } }));
    els.submit.addEventListener('click', checkGuess);

    wireSegmented(els.difficultySeg, (v)=>{ settings.difficulty = v; save(); applySettingsToUI(); });
    wireSegmented(els.scaleSeg, (v)=>{ settings.scale = v; save(); buildNoteGrid(); });
    wireSegmented(els.tuningSeg, (v)=>{ settings.tuning = Number(v); save(); });

    function clampVolume(v){ return Math.max(0, Math.min(100, Math.round(Number(v) || 0))); }

    els.volumeSlider.addEventListener('input', (e)=>{
      const v = clampVolume(e.target.value);
      settings.volume = v;
      els.volumeNumber.value = v;
      save();
    });
    // Don't rewrite the number field's own value while the user is mid-typing
    // (that would fight backspacing/retyping) — just mirror the slider live.
    els.volumeNumber.addEventListener('input', (e)=>{
      const raw = Number(e.target.value);
      if (Number.isNaN(raw)) return;
      const v = clampVolume(raw);
      settings.volume = v;
      els.volumeSlider.value = v;
      save();
    });
    els.volumeNumber.addEventListener('blur', ()=>{
      const v = clampVolume(els.volumeNumber.value);
      settings.volume = v;
      els.volumeNumber.value = v;
      els.volumeSlider.value = v;
      save();
    });

    function openSheet(){ els.sheet.classList.add('show'); els.sheetBackdrop.classList.add('show'); }
    function closeSheet(){ els.sheet.classList.remove('show'); els.sheetBackdrop.classList.remove('show'); }
    els.settingsToggle.addEventListener('click', openSheet);
    els.sheetDone.addEventListener('click', closeSheet);
    els.sheetBackdrop.addEventListener('click', closeSheet);

    // Unlock audio on first interaction
    ['click','touchstart','keydown'].forEach(evt=> window.addEventListener(evt, ()=>{ try{ ensureCtx(); }catch(e){} }, { once:true }));

    // Keyboard controls
    document.addEventListener('keydown', (e)=>{
      const key = e.key;
      if (key === ' ') { e.preventDefault(); playCurrent(); return; }
      // Letter to note mapping (A–G)
      const L = key.toUpperCase();
      if (['A','B','C','D','E','F','G'].includes(L)) {
        selectNote(L);
        if (settings.difficulty !== 'hard') {
          // auto-check on easy/medium
          checkGuess();
        }
        return;
      }
      // Hard mode octave selection via numbers 2–6
      if (settings.difficulty === 'hard' && /^[2-6]$/.test(key)) {
        selectOctave(key);
        return;
      }
      if (key === 'Enter') {
        if (settings.difficulty === 'hard') {
          checkGuess();
        }
      }
    });

    // Init
    load();
    applySettingsToUI();
    buildNoteGrid();
    pickNote();
    updateHud();
  </script>
</body>
</html>
