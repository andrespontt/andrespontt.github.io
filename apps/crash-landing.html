<style>
  :root{
    color-scheme: dark;
    --bg:#0a0e14; --panel:rgba(12,17,26,.88); --panel-strong:rgba(10,14,21,.96);
    --line:rgba(140,200,255,.18); --text:#e8f1fb; --muted:#93a4bd;
    --accent:#38d0ff; --accent-2:#ffb347; --ok:#4be27f; --warn:#ffb347; --bad:#ff5d5d;
    --shadow:0 18px 50px rgba(0,0,0,.5);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; overflow:hidden; background:var(--bg); color:var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button{ font:inherit; color:inherit; cursor:pointer; }

  #game-canvas{ position:fixed; inset:0; display:block; touch-action:none; }

  /* ---------- Main menu ---------- */
  #menu-screen{
    position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:22px; padding:24px; text-align:center;
    background:
      radial-gradient(900px 500px at 50% -10%, rgba(56,208,255,.12), transparent 60%),
      linear-gradient(180deg, #060a10, #0a0e14 60%, #050708);
  }
  #menu-screen h1{ margin:0; font-size:clamp(28px,6vw,44px); letter-spacing:.04em; font-weight:800;
    background:linear-gradient(120deg,#9fe8ff,#38d0ff 55%,#ffb347); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #menu-screen .sub{ margin:0; color:var(--muted); max-width:440px; font-size:.95rem; }
  .planet-choices{ display:flex; gap:14px; flex-wrap:wrap; justify-content:center; margin-top:8px; }
  .planet-btn{
    width:150px; border:1px solid var(--line); border-radius:16px; background:var(--panel);
    padding:18px 12px; display:flex; flex-direction:column; align-items:center; gap:8px;
    transition:transform .15s, border-color .15s; backdrop-filter:blur(10px);
  }
  .planet-btn:active{ transform:scale(.96); }
  .planet-btn:hover{ border-color:var(--accent); }
  .planet-swatch{ width:56px; height:56px; border-radius:50%; box-shadow:inset -8px -8px 16px rgba(0,0,0,.35); }
  .planet-btn b{ font-size:1rem; letter-spacing:.03em; }
  .planet-btn span{ font-size:.75rem; color:var(--muted); }
  #continue-btn{
    border:none; border-radius:999px; padding:14px 34px; font-weight:700; font-size:1rem;
    background:linear-gradient(120deg,var(--accent),#7ee8ff); color:#022; box-shadow:0 10px 26px rgba(56,208,255,.28);
  }
  #continue-btn.hidden{ display:none; }
  #new-game-note{ font-size:.78rem; color:var(--muted); }

  /* ---------- Cinematic ---------- */
  #cinematic-ui{ position:fixed; inset:0; z-index:40; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between; }
  #cinematic-ui.hidden{ display:none; }
  #cine-title{
    margin:max(40px, env(safe-area-inset-top)) auto 0; text-align:center; font-size:clamp(16px,3.4vw,22px);
    letter-spacing:.14em; font-weight:700; color:#fff; text-shadow:0 2px 12px rgba(0,0,0,.6); opacity:0; transition:opacity .6s;
  }
  #cine-title.show{ opacity:1; }
  #skip-btn{
    pointer-events:auto; align-self:flex-end; margin:16px max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom));
    border:1px solid rgba(255,255,255,.35); background:rgba(0,0,0,.35); color:#fff; border-radius:999px; padding:10px 18px; font-size:.82rem;
  }
  #cine-fade{ position:fixed; inset:0; z-index:41; background:#000; opacity:0; pointer-events:none; transition:opacity .9s ease; }
  #cine-fade.on{ opacity:1; }

  /* ---------- HUD ---------- */
  #hud{ position:fixed; inset:0; z-index:20; pointer-events:none; }
  #hud.hidden{ display:none; }

  #resource-bar{
    pointer-events:auto; position:absolute; top:max(12px, env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    display:flex; gap:14px; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:9px 18px;
    font-size:.85rem; font-weight:700; box-shadow:var(--shadow); backdrop-filter:blur(14px);
  }
  #resource-bar .res{ display:flex; align-items:center; gap:5px; color:var(--muted); }
  #resource-bar .res b{ color:var(--text); }

  #objective-panel{
    pointer-events:auto; position:absolute; top:max(64px, calc(env(safe-area-inset-top) + 52px)); left:max(12px, env(safe-area-inset-left));
    max-width:230px; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 14px;
    box-shadow:var(--shadow); backdrop-filter:blur(14px);
  }
  #objective-panel .label{ font-size:.68rem; letter-spacing:.08em; color:var(--muted); text-transform:uppercase; margin-bottom:4px; }
  #objective-panel .obj-text{ font-weight:700; font-size:.92rem; margin-bottom:8px; }
  #objective-panel .checklist{ display:flex; flex-direction:column; gap:4px; font-size:.8rem; color:var(--muted); }
  #objective-panel .checklist span.done{ color:var(--ok); }

  #power-panel{
    pointer-events:auto; position:absolute; top:max(64px, calc(env(safe-area-inset-top) + 52px)); right:max(12px, env(safe-area-inset-right));
    background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:10px 16px; text-align:right;
    box-shadow:var(--shadow); backdrop-filter:blur(14px);
  }
  #power-panel .label{ font-size:.68rem; letter-spacing:.08em; color:var(--muted); text-transform:uppercase; }
  #power-panel .power-val{ font-size:1.15rem; font-weight:800; }

  #back-link{
    pointer-events:auto; position:absolute; bottom:max(12px, env(safe-area-inset-bottom)); left:max(12px, env(safe-area-inset-left));
    width:42px; height:42px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    background:var(--panel); border:1px solid var(--line); color:var(--text); text-decoration:none; font-size:1.15rem; font-weight:700;
    box-shadow:var(--shadow); backdrop-filter:blur(14px);
  }

  #hint-bar{
    pointer-events:none; position:absolute; bottom:max(14px, env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:8px 16px; font-size:.76rem; color:var(--muted);
    max-width:min(90vw,420px); text-align:center; box-shadow:var(--shadow); backdrop-filter:blur(14px);
  }

  /* ---------- Context sheet ---------- */
  #context-panel{
    pointer-events:auto; position:fixed; left:50%; bottom:0; transform:translate(-50%,110%); width:min(420px,94vw);
    background:var(--panel-strong); border:1px solid var(--line); border-radius:20px 20px 0 0; padding:18px 20px max(18px, env(safe-area-inset-bottom));
    box-shadow:var(--shadow); z-index:30; transition:transform .28s cubic-bezier(.2,.8,.2,1);
  }
  #context-panel.show{ transform:translate(-50%,0); }
  #context-panel .cp-close{ position:absolute; top:10px; right:14px; background:none; border:none; color:var(--muted); font-size:1.2rem; }
  #context-panel .cp-title{ font-weight:800; font-size:1.05rem; margin:0 26px 4px 0; }
  #context-panel .cp-sub{ font-size:.82rem; color:var(--muted); margin-bottom:10px; }
  #context-panel .cp-status{ display:inline-block; padding:3px 10px; border-radius:999px; font-size:.7rem; font-weight:800; letter-spacing:.04em; margin-bottom:10px; }
  #context-panel .cp-status.destroyed{ background:rgba(255,93,93,.18); color:var(--bad); }
  #context-panel .cp-status.damaged{ background:rgba(255,179,71,.18); color:var(--warn); }
  #context-panel .cp-status.operational{ background:rgba(75,226,127,.18); color:var(--ok); }
  #context-panel .cp-needs{ display:flex; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  #context-panel .need-chip{ font-size:.8rem; padding:5px 10px; border-radius:8px; background:rgba(255,255,255,.06); }
  #context-panel .need-chip.ok{ color:var(--ok); }
  #context-panel .need-chip.short{ color:var(--bad); }
  #context-panel .cp-action{
    width:100%; border:none; border-radius:12px; padding:13px; font-weight:800; font-size:.95rem;
    background:var(--accent); color:#022; min-height:46px;
  }
  #context-panel .cp-action:disabled{ background:rgba(255,255,255,.08); color:var(--muted); }

  /* ---------- Toast / floating text ---------- */
  #toast{
    position:fixed; top:max(70px, calc(env(safe-area-inset-top) + 60px)); left:50%; transform:translateX(-50%) translateY(-10px);
    background:rgba(10,14,21,.92); border:1px solid var(--accent); color:#fff; padding:10px 20px; border-radius:999px;
    font-weight:700; font-size:.9rem; z-index:35; opacity:0; pointer-events:none; transition:opacity .3s, transform .3s;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  #float-layer{ position:fixed; inset:0; z-index:25; pointer-events:none; }
  .float-text{ position:absolute; font-weight:800; font-size:.85rem; color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.6);
    transform:translate(-50%,-50%); opacity:0; transition:opacity .25s, transform 1.1s ease-out; white-space:nowrap; }
  .float-text.play{ opacity:1; transform:translate(-50%,-160%); }

  .hidden{ display:none !important; }
</style>

<script type="module">
import * as THREE from "three";

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('crash-landing-sw.js').catch(console.error);
}

/* ============================================================
   UTILITIES
   ============================================================ */
const lerp = (a,b,t) => a + (b-a)*t;
const clamp = (v,min,max) => Math.max(min, Math.min(max, v));
const rand = (min,max) => min + Math.random()*(max-min);
const pickArr = (arr) => arr[Math.floor(Math.random()*arr.length)];

function mulberry32(seed){
  return function(){
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function rr(rng, min, max){ return min + rng()*(max-min); }

/* ============================================================
   CONSTANTS
   ============================================================ */
const PLANETS = {
  earth: { name:'Earth', diff:'Easy', sky:0x8fd0ea, ground:0x4c9a5b, fog:0x8fd0ea, deco:0x2e5c3e, hasFlame:true, hasStars:false, hasEarthGlobe:false },
  mars:  { name:'Mars',  diff:'Medium', sky:0xcf9166, ground:0xa1502c, fog:0xcf9166, deco:0x7a3f2a, hasFlame:true, hasStars:false, hasEarthGlobe:false },
  moon:  { name:'Moon',  diff:'Hard', sky:0x03040a, ground:0x8a8a90, fog:0x03040a, deco:0x55555c, hasFlame:false, hasStars:true, hasEarthGlobe:true },
};

const STATUS_COLORS = { destroyed:0xff3b2f, damaged:0xffb347, operational:0x4be27f };

const CELL_W = 4.2, CELL_H = 3.0, GAP = 0.22, DEPTH = 2.6, BASE_H = 0.32;
const COL_X = [-(CELL_W+GAP), 0, (CELL_W+GAP)];
const ROW_Y = [BASE_H + CELL_H/2, BASE_H + CELL_H/2 + CELL_H + GAP];

const MODULE_DEFS = {
  cockpit:   { name:'Cockpit',   col:0, row:1, powerUse:1 },
  cargo:     { name:'Cargo',     col:1, row:1, powerUse:0 },
  engine:    { name:'Engine',    col:2, row:1, powerUse:2 },
  battery:   { name:'Battery',   col:0, row:0, powerUse:0 },
  generator: { name:'Generator', col:1, row:0, powerGen:10 },
  refinery:  { name:'Refinery',  col:2, row:0, powerUse:3 },
};
const REPAIR_COST = {
  cockpit:{iron:2,scrap:2}, cargo:{iron:2,scrap:1}, engine:{iron:5,scrap:3},
  battery:{iron:3,scrap:2}, generator:{iron:4,scrap:2}, refinery:{iron:5,scrap:3},
};
const REPAIR_TIME = 5;
const SHIP_ENTRANCE_X = -(CELL_W+GAP) - CELL_W/2 - 0.4;
const GROUND_Y = 0;
const WALK_SPEED = 3.4;
const CARRY_MAX = 8;
const SAVE_KEY = 'crashlanding_save_v1';

function statusFor(integrity){
  if (integrity <= 20) return 'destroyed';
  if (integrity < 80) return 'damaged';
  return 'operational';
}

/* ============================================================
   RENDERER / SCENE / CAMERA
   ============================================================ */
const canvas = document.getElementById('game-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.shadowMap.enabled = false;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.1, 200);

scene.add(new THREE.HemisphereLight(0xffffff, 0x33261c, 0.95));
const sun = new THREE.DirectionalLight(0xffffff, 0.85);
sun.position.set(12, 22, 14);
scene.add(sun);

function onResize(){
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', onResize);
onResize();

/* ---------- Camera rig: pan + zoom, no free rotation ---------- */
const camState = { x:0, y:2.6, zoom:22, shakeT:0, shakeMag:0 };
function applyCamera(){
  let sx = 0, sy = 0;
  if (camState.shakeT > 0){
    sx = (Math.random()-0.5) * camState.shakeMag;
    sy = (Math.random()-0.5) * camState.shakeMag;
  }
  camera.position.set(camState.x + sx, camState.y + sy, camState.zoom);
  camera.lookAt(camState.x, camState.y - 1.6, 0);
}
function shakeCamera(mag, dur){ camState.shakeMag = mag; camState.shakeT = dur; }

const CAM_X_MIN = -20, CAM_X_MAX = 8, CAM_ZOOM_MIN = 12, CAM_ZOOM_MAX = 34;

/* ============================================================
   POINTER INPUT (pan / pinch-zoom / tap)
   ============================================================ */
const pointers = new Map();
let dragMoved = 0, dragStart = null, pinchStartDist = 0, pinchStartZoom = 0, isPinching = false;

canvas.style.touchAction = 'none';
canvas.addEventListener('pointerdown', (e) => {
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pointers.size === 1){
    dragStart = { x:e.clientX, y:e.clientY, camX:camState.x, camY:camState.y, t:performance.now() };
    dragMoved = 0;
  } else if (pointers.size === 2){
    isPinching = true;
    const pts = [...pointers.values()];
    pinchStartDist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    pinchStartZoom = camState.zoom;
  }
});
canvas.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (isPinching && pointers.size === 2){
    const pts = [...pointers.values()];
    const dist = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    const ratio = pinchStartDist > 0 ? pinchStartDist / Math.max(1,dist) : 1;
    camState.zoom = clamp(pinchStartZoom * ratio, CAM_ZOOM_MIN, CAM_ZOOM_MAX);
  } else if (pointers.size === 1 && dragStart){
    const dx = e.clientX - dragStart.x, dy = e.clientY - dragStart.y;
    dragMoved = Math.max(dragMoved, Math.hypot(dx,dy));
    const scale = camState.zoom / 900;
    camState.x = clamp(dragStart.camX - dx*scale, CAM_X_MIN, CAM_X_MAX);
    camState.y = clamp(dragStart.camY + dy*scale*0.6, 1.4, 4.2);
  }
});
function endPointer(e){
  const wasSingle = pointers.size === 1;
  const start = dragStart;
  pointers.delete(e.pointerId);
  if (pointers.size < 2) isPinching = false;
  if (wasSingle && start && dragMoved < 8 && (performance.now()-start.t) < 550){
    handleTap(e.clientX, e.clientY);
  }
  if (pointers.size === 0) dragStart = null;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  camState.zoom = clamp(camState.zoom + e.deltaY*0.02, CAM_ZOOM_MIN, CAM_ZOOM_MAX);
}, { passive:false });

const raycaster = new THREE.Raycaster();
function handleTap(clientX, clientY){
  const nx = (clientX/window.innerWidth)*2 - 1;
  const ny = -(clientY/window.innerHeight)*2 + 1;
  raycaster.setFromCamera({x:nx,y:ny}, camera);
  const hits = raycaster.intersectObjects(scene.children, true);
  for (const h of hits){
    let o = h.object;
    while (o){
      if (o.userData && o.userData.pickType) { onPick(o.userData); return; }
      o = o.parent;
    }
  }
  closePanel();
}

/* ============================================================
   PARTICLE POOL
   ============================================================ */
const PARTICLE_POOL_SIZE = 60;
const particlePool = [];
const particleGeo = new THREE.BoxGeometry(0.08,0.08,0.08);
for (let i=0;i<PARTICLE_POOL_SIZE;i++){
  const mesh = new THREE.Mesh(particleGeo, new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true }));
  mesh.visible = false;
  scene.add(mesh);
  particlePool.push({ mesh, vel:new THREE.Vector3(), life:0, maxLife:1, active:false });
}
function spawnParticle(pos, color, opts={}){
  const p = particlePool.find(p => !p.active);
  if (!p) return;
  p.active = true; p.mesh.visible = true;
  p.mesh.position.copy(pos);
  p.mesh.material.color.setHex(color);
  p.baseScale = opts.size ?? rand(0.6,1.2);
  p.mesh.scale.setScalar(p.baseScale);
  p.vel.set(opts.vx ?? rand(-1.4,1.4), opts.vy ?? rand(1.2,2.6), opts.vz ?? rand(-0.6,0.6));
  p.life = p.maxLife = opts.life ?? rand(0.5,1.0);
  p.gravity = opts.gravity ?? -3.2;
}
function spawnBurst(pos, color, count, opts={}){
  for (let i=0;i<count;i++) spawnParticle(pos, color, opts);
}
function updateParticles(dt){
  for (const p of particlePool){
    if (!p.active) continue;
    p.life -= dt;
    if (p.life <= 0){ p.active = false; p.mesh.visible = false; continue; }
    p.vel.y += (p.gravity ?? -3) * dt;
    p.mesh.position.addScaledVector(p.vel, dt);
    const t = p.life / p.maxLife;
    p.mesh.material.opacity = t;
    p.mesh.scale.setScalar(Math.max(0.05, t) * p.baseScale);
  }
}

/* ============================================================
   FLOATING TEXT (DOM pool)
   ============================================================ */
const floatLayer = document.getElementById('float-layer');
const floatPool = [];
for (let i=0;i<6;i++){
  const el = document.createElement('div');
  el.className = 'float-text';
  floatLayer.appendChild(el);
  floatPool.push({ el, busy:false });
}
function floatText(worldPos, text, color){
  const f = floatPool.find(f => !f.busy) || floatPool[0];
  f.busy = true;
  const v = worldPos.clone().project(camera);
  const x = (v.x*0.5+0.5) * window.innerWidth;
  const y = (-v.y*0.5+0.5) * window.innerHeight;
  f.el.textContent = text;
  f.el.style.left = x+'px';
  f.el.style.top = y+'px';
  f.el.style.color = color || '#fff';
  f.el.classList.remove('play');
  void f.el.offsetWidth;
  f.el.classList.add('play');
  setTimeout(() => { f.el.classList.remove('play'); f.busy = false; }, 1050);
}

/* ============================================================
   MOVEMENT HELPER
   ============================================================ */
function moveToward(crew, tx, ty, dt){
  const p = crew.group.position;
  const dx = tx - p.x, dy = ty - p.y;
  const dist = Math.hypot(dx,dy);
  if (dist < 0.06){ p.x = tx; p.y = ty; return true; }
  const step = Math.min(dist, WALK_SPEED*dt);
  p.x += (dx/dist) * step;
  p.y += (dy/dist) * step;
  crew.state = 'walking';
  crew.walkT += dt;
  const { legL, legR, armL, armR } = crew.parts;
  legL.rotation.x = Math.sin(crew.walkT*8) * 0.5;
  legR.rotation.x = -Math.sin(crew.walkT*8) * 0.5;
  armL.rotation.x = -Math.sin(crew.walkT*8) * 0.4;
  armR.rotation.x = Math.sin(crew.walkT*8) * 0.4;
  crew.group.rotation.y = dx < 0 ? Math.PI : 0;
  return false;
}
function idlePose(crew, dt){
  crew.state = 'idle';
  const { legL, legR, armL, armR } = crew.parts;
  legL.rotation.x = lerp(legL.rotation.x, 0, dt*6);
  legR.rotation.x = lerp(legR.rotation.x, 0, dt*6);
  armL.rotation.x = lerp(armL.rotation.x, 0, dt*6);
  armR.rotation.x = lerp(armR.rotation.x, 0, dt*6);
}
function workPose(crew, dt, speed=12){
  crew.state = 'working';
  crew.walkT += dt;
  crew.parts.armR.rotation.x = Math.sin(crew.walkT*speed) * 0.85 - 0.3;
}

/* ============================================================
   TASK SYSTEM
   ============================================================ */
function findIdleCrew(preferred){
  if (preferred && !preferred.task) return preferred;
  return crewList.find(c => !c.task) || null;
}
function assignGatherTask(crew, node){
  if (!crew || crew.task || !node.alive) return false;
  crew.task = { type:'gather', node, phase:'walking', timer:0, carried:0 };
  return true;
}
function assignRepairTask(crew, mod){
  if (!crew || crew.task) return false;
  crew.task = { type:'repair', mod, phase:'walking', timer:0, startIntegrity: mod.integrity };
  mod.repairing = true;
  return true;
}

function updateCrewTask(crew, dt){
  const t = crew.task;
  if (!t){ idlePose(crew, dt); return; }

  if (t.type === 'gather'){
    if (t.phase === 'walking'){
      const arrived = moveToward(crew, t.node.alive ? t.node.worldX : SHIP_ENTRANCE_X, GROUND_Y, dt);
      if (arrived) t.phase = t.node.alive ? 'working' : 'returning';
    } else if (t.phase === 'working'){
      workPose(crew, dt, 10);
      t.timer += dt;
      if (t.timer >= 0.9){
        t.timer = 0;
        const chunk = Math.min(2, t.node.amount);
        t.node.amount -= chunk;
        t.carried += chunk;
        updateNodeScale(t.node);
        spawnBurst(new THREE.Vector3(t.node.worldX, 0.5, t.node.group.position.z), t.node.type==='iron'?0x8a7050:0x9aa3ad, 4, {vy:1.6,size:0.7});
        floatText(new THREE.Vector3(t.node.worldX, 1.3, 0), `+${chunk} ${t.node.type.toUpperCase()}`, t.node.type==='iron'?'#d7b98a':'#cbd5e1');
        if (t.node.amount <= 0){ removeNodeIfEmpty(t.node); t.phase = 'returning'; }
        else if (t.carried >= CARRY_MAX){ t.phase = 'returning'; }
      }
    } else if (t.phase === 'returning'){
      const arrived = moveToward(crew, SHIP_ENTRANCE_X, GROUND_Y, dt);
      if (arrived){
        inventory[t.node.type] += t.carried;
        updateInventoryUI();
        floatText(new THREE.Vector3(SHIP_ENTRANCE_X, 1.5, 0), `+${t.carried} ${t.node.type.toUpperCase()}`, '#4be27f');
        crew.task = null;
      }
    }
  } else if (t.type === 'repair'){
    if (t.phase === 'walking'){
      const arrived = moveToward(crew, t.mod.worldX, t.mod.worldY, dt);
      if (arrived) t.phase = 'working';
    } else if (t.phase === 'working'){
      workPose(crew, dt, 16);
      t.timer += dt;
      if (Math.random() < dt*3.2){
        spawnBurst(new THREE.Vector3(t.mod.worldX, t.mod.worldY, DEPTH/2), 0xfff2b0, 3, {vy:1.4, size:0.5, life:0.4});
      }
      const p = clamp(t.timer / REPAIR_TIME, 0, 1);
      t.mod.integrity = Math.round(lerp(t.startIntegrity, 100, p));
      updateModuleVisual(t.mod);
      if (t.timer >= REPAIR_TIME){
        t.mod.integrity = 100;
        t.mod.repairing = false;
        updateModuleVisual(t.mod);
        floatText(new THREE.Vector3(t.mod.worldX, t.mod.worldY+1.6, 0), `${t.mod.name.toUpperCase()} ONLINE`, '#4be27f');
        crew.task = null;
        onModuleRepaired(t.mod);
      }
    }
  }
}

function powerPercent(){
  const b = modules.battery.status==='operational' ? 50 : modules.battery.status==='damaged' ? 20 : 0;
  const g = modules.generator.status==='operational' ? 50 : modules.generator.status==='damaged' ? 20 : 0;
  return b+g;
}
function updatePowerUI(){
  const p = powerPercent();
  const el = document.getElementById('power-val');
  el.textContent = p + '%';
  el.style.color = p < 30 ? 'var(--bad)' : p < 70 ? 'var(--warn)' : 'var(--ok)';
}

const objectives = [
  { id:'power', text:'Restore Emergency Power', mods:['battery','generator'], nextToast:'⚡ POWER RESTORED' },
  { id:'refinery', text:'Repair the Refinery', mods:['refinery'], nextToast:'🔧 PRODUCTION RESTORED' },
];
let objIndex = 0;
function objectivesComplete(){ return objIndex >= objectives.length; }
function updateObjectiveUI(){
  const textEl = document.getElementById('obj-text');
  const listEl = document.getElementById('obj-checklist');
  if (objectivesComplete()){
    textEl.textContent = 'All current systems restored';
    listEl.innerHTML = '<span class="done">✓ Standing by for next mission phase</span>';
    return;
  }
  const o = objectives[objIndex];
  textEl.textContent = o.text;
  listEl.innerHTML = o.mods.map(k => {
    const m = modules[k];
    const done = m.status === 'operational';
    return `<span class="${done?'done':''}">${done?'✓':'○'} ${m.name}</span>`;
  }).join('');
}
function checkObjectives(){
  if (objectivesComplete()) return;
  const o = objectives[objIndex];
  if (o.mods.every(k => modules[k].status === 'operational')){
    showToast(o.nextToast);
    objIndex++;
    updateObjectiveUI();
  }
}
function onModuleRepaired(mod){
  updatePowerUI();
  checkObjectives();
  saveGame();
}

let selectedCrew = null;

function closePanel(){ panelEl.classList.remove('show'); }
function openPanel(html){ panelBody.innerHTML = html; panelEl.classList.add('show'); }

function onPick(data){
  if (data.pickType === 'crew'){
    selectedCrew = data.crew;
    showCrewPanel(data.crew);
  } else if (data.pickType === 'resource'){
    showResourcePanel(data.node);
  } else if (data.pickType === 'module'){
    showModulePanel(data.module);
  }
}

function showCrewPanel(crew){
  const jobText = crew.task ? (crew.task.type==='gather' ? `Gathering ${crew.task.node.type}` : `Repairing ${crew.task.mod.name}`) : 'Idle';
  openPanel(`
    <div class="cp-title">${crew.name}</div>
    <div class="cp-sub">${jobText}</div>
    <p style="color:var(--muted);font-size:.82rem;margin:0 0 4px;">Tap a resource deposit or a damaged module to send ${crew.name} there.</p>
  `);
}

function showResourcePanel(node){
  const label = node.type === 'iron' ? 'Iron Deposit' : 'Scrap Pile';
  openPanel(`
    <div class="cp-title">${label}</div>
    <div class="cp-sub">${node.amount} units remaining</div>
    <button class="cp-action" id="cp-gather">${node.type==='iron' ? 'MINE' : 'SALVAGE'}</button>
  `);
  document.getElementById('cp-gather').addEventListener('click', () => {
    const crew = findIdleCrew(selectedCrew);
    if (!crew){ showToast('No crew available'); return; }
    assignGatherTask(crew, node);
    closePanel();
  });
}

function showModulePanel(mod){
  const cost = REPAIR_COST[mod.key];
  const needsHtml = mod.status === 'operational' ? '' : `
    <div class="cp-needs">
      <span class="need-chip ${inventory.iron>=cost.iron?'ok':'short'}">Fe ${inventory.iron}/${cost.iron}</span>
      <span class="need-chip ${inventory.scrap>=cost.scrap?'ok':'short'}">Scrap ${inventory.scrap}/${cost.scrap}</span>
    </div>`;
  const canRepair = mod.status !== 'operational' && !mod.repairing && inventory.iron>=cost.iron && inventory.scrap>=cost.scrap;
  openPanel(`
    <div class="cp-title">${mod.name}</div>
    <div class="cp-status ${mod.status}">${mod.status.toUpperCase()} · ${mod.integrity}%</div>
    ${needsHtml}
    ${mod.status === 'operational'
      ? `<p style="color:var(--ok);font-size:.85rem;">Fully operational.</p>`
      : `<button class="cp-action" id="cp-repair" ${canRepair?'':'disabled'}>${mod.repairing ? 'REPAIRING…' : 'REPAIR'}</button>`}
  `);
  const btn = document.getElementById('cp-repair');
  if (btn) btn.addEventListener('click', () => {
    if (mod.repairing) return;
    if (inventory.iron < cost.iron || inventory.scrap < cost.scrap) return;
    const crew = findIdleCrew(selectedCrew);
    if (!crew){ showToast('No crew available'); return; }
    inventory.iron -= cost.iron; inventory.scrap -= cost.scrap;
    updateInventoryUI();
    assignRepairTask(crew, mod);
    closePanel();
  });
}

/* ============================================================
   RANDOM NEW-GAME GENERATION (always playable)
   ============================================================ */
function newGameState(planetKey, rng){
  // Damage rolls — battery/generator/refinery always need real work,
  // but resource totals below guarantee enough material exists.
  const rolls = {
    cockpit: rr(rng,45,80), cargo: rr(rng,55,85), engine: rr(rng,15,45),
    battery: rr(rng,10,45), generator: rr(rng,8,40), refinery: rr(rng,10,45),
  };
  for (const key of Object.keys(modules)){
    modules[key].integrity = Math.round(rolls[key]);
    updateModuleVisual(modules[key]);
  }
  inventory.iron = 0; inventory.scrap = 0;
  updateInventoryUI();

  resourceNodes.forEach(n => scene.remove(n.group));
  resourceNodes = NODE_LAYOUT.map(spec => {
    const amount = Math.round(rr(rng, spec.type==='iron'?7:5, spec.type==='iron'?11:8));
    return createResourceNode(spec.type, spec.x, amount);
  });
  resourceNodes.forEach(updateNodeScale);

  objIndex = 0;
  updateObjectiveUI();
  updatePowerUI();
}

/* ============================================================
   SAVE / LOAD
   ============================================================ */
function saveGame(){
  if (!currentPlanet) return;
  const data = {
    planet: currentPlanet,
    inventory: { ...inventory },
    modules: Object.fromEntries(Object.entries(modules).map(([k,m]) => [k, m.integrity])),
    resourceNodes: resourceNodes.map(n => ({ type:n.type, x:n.worldX, amount:n.amount })),
    objIndex,
  };
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch(e){}
}
function loadSave(){
  try { const raw = localStorage.getItem(SAVE_KEY); return raw ? JSON.parse(raw) : null; } catch(e){ return null; }
}
function applySave(data){
  currentPlanet = data.planet;
  buildWorld(currentPlanet);
  reparentShipAndCrew();

  inventory.iron = data.inventory.iron||0; inventory.scrap = data.inventory.scrap||0;
  updateInventoryUI();

  for (const key of Object.keys(modules)){
    modules[key].integrity = data.modules[key] ?? modules[key].integrity;
    updateModuleVisual(modules[key]);
  }

  resourceNodes.forEach(n => scene.remove(n.group));
  resourceNodes = (data.resourceNodes||[]).filter(n=>n.amount>0).map(n => createResourceNode(n.type, n.x, n.amount));
  resourceNodes.forEach(updateNodeScale);

  objIndex = data.objIndex || 0;
  updateObjectiveUI();
  updatePowerUI();
}
setInterval(() => { if (gameState === 'playing') saveGame(); }, 8000);

/* ============================================================
   CINEMATIC
   ============================================================ */
let cinematic = null;
function reparentShipAndCrew(){
  // no-op placeholder kept for symmetry; ship/crew are persistent groups
}
function startCinematic(planetKey, onDone){
  const cfg = PLANETS[planetKey];
  document.getElementById('cinematic-ui').classList.remove('hidden');
  const titleEl = document.getElementById('cine-title');
  titleEl.textContent = `APPROACHING ${cfg.name.toUpperCase()}`;
  requestAnimationFrame(() => titleEl.classList.add('show'));

  shipGroup.position.set(20, 15, 0);
  shipGroup.rotation.z = 0.5;
  camState.x = 0; camState.y = 3; camState.zoom = 26;

  cinematic = { t:0, duration:5.5, phase:'descend', onDone, cfg, holdT:0 };
}
function updateCinematic(dt){
  const c = cinematic;
  if (!c) return;
  if (c.phase === 'descend'){
    c.t += dt;
    const p = clamp(c.t / c.duration, 0, 1);
    const eased = p*p*(3-2*p);
    shipGroup.position.x = lerp(20, 0, eased);
    shipGroup.position.y = lerp(15, 0, eased);
    shipGroup.rotation.z = lerp(0.5, 0, eased) + Math.sin(c.t*10) * 0.03 * (1-p);
    if (c.cfg.hasFlame && Math.random() < dt*22){
      spawnBurst(new THREE.Vector3(shipGroup.position.x - 1.5, shipGroup.position.y, 0.5), 0xff8a3d, 1, {vx:-2,vy:-0.4,life:0.5,size:1.1,gravity:0});
    }
    if (Math.random() < dt*3){
      const keys = Object.keys(modules);
      const m = modules[pickArr(keys)];
      m.light.material.color.setHex(0xff3b2f);
    }
    if (p >= 1){
      c.phase = 'impact';
      shipGroup.position.set(0,0,0);
      shipGroup.rotation.z = 0;
      shakeCamera(0.5, 0.4);
      spawnBurst(new THREE.Vector3(0,0.2,0.6), c.cfg.ground, 24, {vy:2.4, size:1.3, life:0.9, vx:0});
      for (const key of Object.keys(modules)) updateModuleVisual(modules[key]);
    }
  } else if (c.phase === 'impact'){
    c.holdT += dt;
    if (c.holdT > 1.6){
      c.phase = 'fade';
      c.holdT = 0;
      document.getElementById('cine-fade').classList.add('on');
    }
  } else if (c.phase === 'fade'){
    c.holdT += dt;
    if (c.holdT > 2.4){
      document.getElementById('cinematic-ui').classList.add('hidden');
      document.getElementById('cine-title').classList.remove('show');
      const done = c.onDone;
      cinematic = null;
      setTimeout(() => document.getElementById('cine-fade').classList.remove('on'), 50);
      done && done();
    }
  }
}
function skipCinematic(){
  if (!cinematic) return;
  shipGroup.position.set(0,0,0);
  shipGroup.rotation.z = 0;
  for (const key of Object.keys(modules)) updateModuleVisual(modules[key]);
  document.getElementById('cinematic-ui').classList.add('hidden');
  document.getElementById('cine-title').classList.remove('show');
  document.getElementById('cine-fade').classList.remove('on');
  const done = cinematic.onDone;
  cinematic = null;
  done && done();
}
document.getElementById('skip-btn').addEventListener('click', skipCinematic);

/* ============================================================
   GAME FLOW
   ============================================================ */
let currentPlanet = null;
let gameState = 'menu'; // menu | cinematic | playing

function revealHud(){
  document.getElementById('hud').classList.remove('hidden');
  gameState = 'playing';
  camState.x = -2; camState.y = 2.6; camState.zoom = 22;
}

function startNewGame(planetKey){
  currentPlanet = planetKey;
  document.getElementById('menu-screen').classList.add('hidden');
  buildWorld(planetKey);

  if (crewList.length === 0){
    crewList = CREW_NAMES.map((n,i) => createCrew(n, CREW_COLORS[i], SHIP_ENTRANCE_X - i*0.7));
  } else {
    crewList.forEach((c,i) => { c.group.position.set(SHIP_ENTRANCE_X - i*0.7, GROUND_Y, rand(-0.2,0.2)); c.task = null; });
  }

  const seed = Math.floor(Math.random()*1e9);
  const rng = mulberry32(seed);
  newGameState(planetKey, rng);
  saveGame();

  gameState = 'cinematic';
  startCinematic(planetKey, revealHud);
}

function continueGame(){
  const data = loadSave();
  if (!data) return;
  document.getElementById('menu-screen').classList.add('hidden');
  if (crewList.length === 0){
    crewList = CREW_NAMES.map((n,i) => createCrew(n, CREW_COLORS[i], SHIP_ENTRANCE_X - i*0.7));
  } else {
    crewList.forEach((c,i) => { c.group.position.set(SHIP_ENTRANCE_X - i*0.7, GROUND_Y, rand(-0.2,0.2)); c.task = null; });
  }
  applySave(data);
  revealHud();
}

document.querySelectorAll('.planet-btn').forEach(btn => {
  btn.addEventListener('click', () => startNewGame(btn.dataset.planet));
});
const continueBtn = document.getElementById('continue-btn');
if (loadSave()){ continueBtn.classList.remove('hidden'); }
continueBtn.addEventListener('click', continueGame);

/* ============================================================
   MAIN LOOP
   ============================================================ */
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  if (gameState === 'cinematic'){
    updateCinematic(dt);
  } else if (gameState === 'playing'){
    crewList.forEach(c => updateCrewTask(c, dt));
    for (const key of Object.keys(modules)){
      const m = modules[key];
      const speed = m.status==='operational' ? 1 : m.status==='damaged' ? 0.25 : 0;
      if (m.parts.rotor) m.parts.rotor.rotation.z += dt*3*speed;
      if (m.parts.disc) m.parts.disc.rotation.y += dt*2.4*speed;
      if (m.parts.glow) m.parts.glow.material.color.setHex(STATUS_COLORS[m.status]);
      if (m.parts.glowRing) m.parts.glowRing.material.color.setHex(m.status==='operational'?0xffb347:0x223);
      if (m.parts.screen) m.parts.screen.material.color.setHex(m.status==='operational' ? 0x38d0ff : m.status==='damaged' ? (Math.random()<0.5?0x1a2230:0xffb347) : 0x1a2230);
      if (m.status === 'destroyed' && Math.random() < dt*0.4){
        spawnBurst(new THREE.Vector3(m.worldX, m.worldY, DEPTH/2), 0x555555, 2, {vy:1.0, size:0.5, life:0.8, gravity:-1});
      }
    }
  }

  if (camState.shakeT > 0) camState.shakeT -= dt;
  updateParticles(dt);
  applyCamera();
  renderer.render(scene, camera);
}
animate();
</script>
