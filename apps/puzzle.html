<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Toddler Puzzle</title>
    <link rel="manifest" href="puzzle-manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2PFGZZBZ0B"></script>
    <script src="/assets/js/analytics.js"></script>
    <style>
        /* Reset & Base */
        :root {
            --bg-color: #FFD700;
            /* Pastel Colors fallback */
            --text-color: #333;
            --slot-size: 100px;
            --shape-size: 92px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: var(--bg-color);
            transition: background-color 0.5s ease;
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
        }

        #confetti-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2000;
        }

        .back-link {
            position: absolute;
            top: max(10px, env(safe-area-inset-top));
            left: max(10px, env(safe-area-inset-left));
            z-index: 3000;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.5);
            color: #333;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
        }

        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;
            padding: 10px;
            position: absolute;
            top: 0;
            left: 0;
        }

        h1 {
            font-size: 2rem;
            color: var(--text-color);
            margin: 0;
            pointer-events: none;
        }

        .slots-area,
        .shapes-area {
            display: flex;
            justify-content: center;
            gap: 30px;
            width: 100%;
            min-height: 150px;
            align-items: center;
        }

        .slot {
            width: var(--slot-size);
            height: var(--slot-size);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            transition: transform 0.15s ease;
        }

        .slot svg {
            width: 100%;
            height: 100%;
            display: block;
            transition: filter 0.15s ease;
        }

        /* "During": the correct slot glows and grows while the matching
           shape is hovering over it, before the finger even lifts */
        .slot.hover-match {
            transform: scale(1.12);
        }

        .slot.hover-match svg {
            filter: drop-shadow(0 0 8px rgba(46, 204, 64, 0.95)) drop-shadow(0 0 3px rgba(46, 204, 64, 1));
        }

        /* "After": a ring pulses outward from the slot the instant a shape locks in */
        @keyframes successFlash {
            0% {
                box-shadow: 0 0 0 0 rgba(46, 204, 64, 0.55);
            }

            100% {
                box-shadow: 0 0 0 26px rgba(46, 204, 64, 0);
            }
        }

        .slot.success-flash {
            border-radius: 50%;
            animation: successFlash 0.6s ease-out;
        }

        /* Shape Base Styles */
        .shape {
            width: var(--shape-size);
            height: var(--shape-size);
            cursor: grab;
            position: absolute;
            transition: transform 0.1s;
            z-index: 10;
        }

        .shape svg {
            width: 100%;
            height: 100%;
            display: block;
            overflow: visible;
        }

        .shape:active {
            transform: scale(1.1);
            cursor: grabbing;
            z-index: 100;
        }

        /* "After": the placed shape does a happy little bounce on landing */
        @keyframes placedPop {
            0% {
                transform: scale(1);
            }

            35% {
                transform: scale(1.35);
            }

            60% {
                transform: scale(0.95);
            }

            100% {
                transform: scale(1);
            }
        }

        .shape.placed-pop {
            animation: placedPop 0.45s ease;
        }

        /* Success Message */
        .success-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
            z-index: 1000;
        }

        .success-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .success-overlay h2 {
            font-size: 5rem;
            color: #FF851B;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0px #fff;
            animation: bounce 0.6s infinite alternate;
        }

        @keyframes bounce {
            from {
                transform: scale(1);
            }

            to {
                transform: scale(1.2);
            }
        }

        .cat-gif {
            width: 280px;
            height: 280px;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        #reset-btn {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 1.5rem;
            background: #0074D9;
            color: white;
            border: none;
            border-radius: 50px;
            box-shadow: 0 5px 0 #005aab;
            cursor: pointer;
            font-weight: bold;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        /* Hint Styles */
        #hint-arrow {
            position: absolute;
            width: 60px;
            height: 60px;
            z-index: 1500;
            pointer-events: none;
            display: none;
            filter: drop-shadow(0 4px 4px rgba(0, 0, 0, 0.3));
            animation: floatDown 1s infinite;
        }

        @keyframes floatDown {
            0% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(15px);
            }

            100% {
                transform: translateY(0);
            }
        }

        #hint-arrow svg {
            width: 100%;
            height: 100%;
            fill: #FF4136;
            /* Bright Red Arrow */
            stroke: white;
            stroke-width: 2px;
        }
    </style>
</head>

<body>

    <a href="index.html" class="back-link" title="Back to Apps">←</a>

    <canvas id="confetti-canvas"></canvas>

    <!-- Hint Element -->
    <div id="hint-arrow">
        <svg viewBox="0 0 24 24">
            <path d="M12 21l-12-18h24z" />
        </svg>
    </div>

    <div id="game-container">
        <h1>Shapes Puzzle</h1>

        <div class="slots-area" id="slots-area">
            <!-- Added dynamically -->
        </div>

        <!-- Shapes start area -->
        <div class="shapes-area" id="start-zone">
            <!-- Added dynamically -->
        </div>
    </div>

    <div class="success-overlay" id="success-overlay">
        <h2>YAY!</h2>
        <img src="" id="cat-img" class="cat-gif" alt="Happy Cat">
        <button id="reset-btn">Play Again</button>
    </div>

    <script>
        // Register Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('puzzle-sw.js').catch(console.error);
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const bgColors = [
            '#FFD700', // Gold
            '#FFB3BA', // Pastel Pink
            '#BAFFC9', // Pastel Green
            '#BAE1FF', // Pastel Blue
            '#eecbff', // Pastel Purple
            '#ffffba'  // Pastel Yellow
        ];

        function playPop() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);

            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        function playWinSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            [523.25, 659.25, 783.99, 1046.50, 1318.51, 1567.98].forEach((freq, i) => {
                setTimeout(() => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                }, i * 80);
            });
        }

        // Confetti Logic
        const confettiCanvas = document.getElementById('confetti-canvas');
        const ctx = confettiCanvas.getContext('2d');
        let confettiParticles = [];
        let confettiActive = false;

        function resizeConfetti() {
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeConfetti);
        resizeConfetti();

        function fireConfetti() {
            confettiActive = true;
            confettiParticles = [];
            const colors = ['#f00', '#0f0', '#00f', '#ff0', '#0ff', '#f0f'];

            for (let i = 0; i < 150; i++) {
                confettiParticles.push({
                    x: window.innerWidth / 2,
                    y: window.innerHeight / 2,
                    r: Math.random() * 6 + 2,
                    dx: (Math.random() - 0.5) * 15,
                    dy: (Math.random() - 0.5) * 15,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    tilt: Math.random() * 10,
                    tiltAngle: Math.random() * Math.PI,
                    tiltAngleInv: Math.random() * 0.2
                });
            }
            loopConfetti();
        }

        function loopConfetti() {
            if (!confettiActive) return;
            ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

            let moving = false;
            confettiParticles.forEach(p => {
                p.tiltAngle += p.tiltAngleInv;
                p.y += (Math.cos(p.tiltAngle) + 1 + p.r / 2) / 2;
                p.x += Math.sin(p.tiltAngle) * 2;
                p.x += p.dx;
                p.y += p.dy;
                p.dy += 0.1; // gravity
                p.dx *= 0.96; // friction

                if (p.y < confettiCanvas.height) moving = true;

                ctx.beginPath();
                ctx.lineWidth = p.r;
                ctx.strokeStyle = p.color;
                ctx.moveTo(p.x + p.tilt + p.r / 2, p.y);
                ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r);
                ctx.stroke();
            });

            if (moving) requestAnimationFrame(loopConfetti);
            else confettiActive = false;
        }

        // Pool of available shapes. Each round picks a random subset of these,
        // so kids see a different combination (and new shapes) every time.
        const SHAPES = [
            { type: 'square', color: '#FF4136', shadow: '#b32d25', body: '<rect x="8" y="8" width="84" height="84" rx="12"/>' },
            { type: 'circle', color: '#0074D9', shadow: '#0056a3', body: '<circle cx="50" cy="50" r="42"/>' },
            { type: 'triangle', color: '#2ECC40', shadow: '#1e872a', body: '<polygon points="50,8 94,90 6,90"/>' },
            { type: 'star', color: '#FFDC00', shadow: '#c9ab00', body: '<polygon points="50,4 61,36 95,36 67,57 78,90 50,70 22,90 33,57 5,36 39,36"/>' },
            { type: 'heart', color: '#FF69B4', shadow: '#cc4f8e', body: '<path d="M50,95 C15,70 2,47 2,30 C2,15 14,5 28,5 C40,5 50,14 50,25 C50,14 60,5 72,5 C86,5 98,15 98,30 C98,47 85,70 50,95 Z"/>' },
            { type: 'diamond', color: '#7B2FF7', shadow: '#4b1c9c', body: '<polygon points="50,4 96,50 50,96 4,50"/>' },
            { type: 'pentagon', color: '#00A99D', shadow: '#007a70', body: '<polygon points="50,4 95,38 78,92 22,92 5,38"/>' },
            { type: 'hexagon', color: '#8B4513', shadow: '#5c2d0c', body: '<polygon points="50,4 91,27 91,73 50,96 9,73 9,27"/>' }
        ];
        const ROUND_SIZE = 3; // shapes shown per round

        function pieceSVG(shape) {
            return `<svg viewBox="0 0 100 100" style="filter:drop-shadow(0 5px 0 ${shape.shadow})"><g fill="${shape.color}">${shape.body}</g></svg>`;
        }

        function slotSVG(shape) {
            return `<svg viewBox="0 0 100 100"><g fill="none" stroke="${shape.color}" stroke-width="7" stroke-dasharray="11,7" stroke-linejoin="round" stroke-linecap="round">${shape.body}</g></svg>`;
        }

        function pickRoundShapes(n) {
            const pool = [...SHAPES];
            for (let i = pool.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [pool[i], pool[j]] = [pool[j], pool[i]];
            }
            return pool.slice(0, n);
        }

        let roundShapes = []; // shapes in play for the current round

        const slotsArea = document.getElementById('slots-area');
        const startZone = document.getElementById('start-zone');
        const resetBtn = document.getElementById('reset-btn');
        const successOverlay = document.getElementById('success-overlay');
        const catImg = document.getElementById('cat-img');
        const hintArrow = document.getElementById('hint-arrow');

        let nextCatUrl = '';
        let failureCounts = {}; // Track mistakes per shape type
        const ENABLE_HINTS = false;

        function preloadNextCat() {
            const randomNum = Math.floor(Math.random() * 100000);
            nextCatUrl = `https://cataas.com/cat/gif?t=${randomNum}`;
            const img = new Image();
            img.src = nextCatUrl;
        }

        document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
        document.addEventListener('contextmenu', (e) => e.preventDefault());

        function initGame() {
            slotsArea.innerHTML = '';
            startZone.innerHTML = '';
            successOverlay.classList.remove('show');
            confettiActive = false;
            ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            failureCounts = {};
            hideHint();

            const randomColor = bgColors[Math.floor(Math.random() * bgColors.length)];
            document.body.style.backgroundColor = randomColor;
            document.documentElement.style.setProperty('--bg-color', randomColor);

            if (!nextCatUrl) preloadNextCat();

            roundShapes = pickRoundShapes(ROUND_SIZE);

            roundShapes.forEach(shape => {
                const slot = document.createElement('div');
                slot.className = 'slot';
                slot.dataset.shape = shape.type;
                slot.innerHTML = slotSVG(shape);
                slotsArea.appendChild(slot);
            });

            const shuffled = [...roundShapes].sort(() => Math.random() - 0.5);

            shuffled.forEach(shape => {
                const el = document.createElement('div');
                el.classList.add('shape');
                el.dataset.type = shape.type;
                el.innerHTML = pieceSVG(shape);
                const rotation = (Math.random() * 40 - 20).toFixed(0);
                el.style.transform = `rotate(${rotation}deg)`;
                startZone.appendChild(el);
                makeDraggable(el);
            });
        }

        function showHint(type) {
            const slot = document.querySelector(`.slot[data-shape="${type}"]`);
            if (!slot) return;

            const rect = slot.getBoundingClientRect();
            // Position arrow above the slot
            hintArrow.style.left = (rect.left + rect.width / 2 - 30) + 'px'; // width is 60px
            hintArrow.style.top = (rect.top - 70) + 'px'; // 70px above
            hintArrow.style.display = 'block';
        }

        function hideHint() {
            hintArrow.style.display = 'none';
        }

        // "After": bounce the placed shape and pulse a ring on its slot
        function celebratePlacement(shapeEl, slotEl) {
            slotEl.classList.remove('hover-match');

            shapeEl.classList.add('placed-pop');
            shapeEl.addEventListener('animationend', () => {
                shapeEl.classList.remove('placed-pop');
            }, { once: true });

            slotEl.classList.add('success-flash');
            slotEl.addEventListener('animationend', () => {
                slotEl.classList.remove('success-flash');
            }, { once: true });
        }

        function makeDraggable(el) {
            let isDragging = false;
            let touchId = null; // identifier of the finger driving this drag; other fingers on screen are ignored
            let hoveredSlot = null; // slot currently glowing because this shape is correctly positioned over it
            let startX, startY, initialLeft, initialTop;
            let currentX, currentY;

            // "During": glow the matching slot while the shape hovers over it, before drop
            const updateHoverState = () => {
                const rect = el.getBoundingClientRect();
                const center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };

                let matched = null;
                for (const slot of document.querySelectorAll('.slot')) {
                    const sRect = slot.getBoundingClientRect();
                    if (center.x >= sRect.left - 20 && center.x <= sRect.right + 20 &&
                        center.y >= sRect.top - 20 && center.y <= sRect.bottom + 20) {
                        if (slot.dataset.shape === el.dataset.type) matched = slot;
                        break;
                    }
                }

                if (hoveredSlot && hoveredSlot !== matched) {
                    hoveredSlot.classList.remove('hover-match');
                }
                if (matched) matched.classList.add('hover-match');
                hoveredSlot = matched;
            };

            const clearHoverState = () => {
                if (hoveredSlot) {
                    hoveredSlot.classList.remove('hover-match');
                    hoveredSlot = null;
                }
            };

            const onMove = (clientX, clientY) => {
                if (!isDragging) return;

                const deltaX = clientX - startX;
                const deltaY = clientY - startY;

                currentX = initialLeft + deltaX;
                currentY = initialTop + deltaY;

                el.style.position = 'fixed';
                el.style.left = `${currentX}px`;
                el.style.top = `${currentY}px`;
                el.style.transform = 'scale(1.2) rotate(0deg)';
                el.style.zIndex = 100;

                updateHoverState();
            };

            const onEnd = () => {
                if (!isDragging) return;
                isDragging = false;
                touchId = null;

                el.style.zIndex = 10;
                const rect = el.getBoundingClientRect();
                const center = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };

                let dropped = false;
                const slots = document.querySelectorAll('.slot');

                for (let slot of slots) {
                    const sRect = slot.getBoundingClientRect();
                    if (center.x >= sRect.left - 20 && center.x <= sRect.right + 20 &&
                        center.y >= sRect.top - 20 && center.y <= sRect.bottom + 20) {

                        if (slot.dataset.shape === el.dataset.type) {
                            snapTo(el, sRect);
                            dropped = true;
                            playPop();
                            checkWin();
                            hideHint(); // Success hides hint
                            celebratePlacement(el, slot);
                        }
                        break;
                    }
                }

                clearHoverState();

                if (!dropped) {
                    // Failure Logic
                    const type = el.dataset.type;
                    if (!failureCounts[type]) failureCounts[type] = 0;
                    failureCounts[type]++;

                    if (failureCounts[type] >= 2 && ENABLE_HINTS) {
                        showHint(type);
                    }

                    // Leave where it is, do not reset to static
                    el.style.transition = 'transform 0.2s ease-out, left 0.1s ease-out, top 0.1s ease-out';
                    el.style.transform = `scale(1) rotate(${(Math.random() * 40 - 20)}deg)`;
                    el.style.width = '';
                    el.style.height = '';

                    setTimeout(() => {
                        el.style.transition = '';
                    }, 200);
                }
            };

            const snapTo = (element, targetRect) => {
                const tCenterX = targetRect.left + targetRect.width / 2;
                const tCenterY = targetRect.top + targetRect.height / 2;

                element.style.transform = 'scale(1) rotate(0deg)';
                element.style.width = getComputedStyle(element).width;
                element.style.height = getComputedStyle(element).height;

                const w = parseFloat(element.style.width);
                const h = parseFloat(element.style.height);

                element.style.left = `${tCenterX - w / 2}px`;
                element.style.top = `${tCenterY - h / 2}px`;
                element.dataset.locked = "true";
                element.style.pointerEvents = 'none';
            };

            const startDrag = (e) => {
                if (el.dataset.locked || isDragging) return;

                // Hide hint when user tries again
                hideHint();

                if (audioCtx.state === 'suspended') audioCtx.resume();
                let clientX, clientY;
                if (e.type === 'mousedown') {
                    clientX = e.clientX;
                    clientY = e.clientY;
                    e.preventDefault();
                } else {
                    // Only track the finger that actually touched this shape.
                    // Ignore other fingers already resting elsewhere on screen
                    // (common with toddlers holding the phone).
                    const touch = e.changedTouches[0];
                    touchId = touch.identifier;
                    clientX = touch.clientX;
                    clientY = touch.clientY;
                    e.preventDefault();
                }
                isDragging = true;
                startX = clientX;
                startY = clientY;
                const rect = el.getBoundingClientRect();
                initialLeft = rect.left;
                initialTop = rect.top;
                el.style.width = rect.width + 'px';
                el.style.height = rect.height + 'px';
                el.style.position = 'fixed';
                el.style.left = initialLeft + 'px';
                el.style.top = initialTop + 'px';
                // A short eased lag on position gives the piece a touch of inertia
                // as it chases the finger, instead of snapping to it instantly.
                el.style.transition = 'transform 0.1s, left 0.16s ease-out, top 0.16s ease-out';
            };

            el.addEventListener('mousedown', startDrag);
            el.addEventListener('touchstart', startDrag, { passive: false });

            window.addEventListener('mousemove', (e) => onMove(e.clientX, e.clientY));
            window.addEventListener('touchmove', (e) => {
                if (!isDragging || touchId === null) return;
                const touch = Array.from(e.touches).find(t => t.identifier === touchId);
                if (touch) onMove(touch.clientX, touch.clientY);
            }, { passive: false });

            window.addEventListener('mouseup', onEnd);
            const handleTouchEnd = (e) => {
                if (!isDragging || touchId === null) return;
                const touch = Array.from(e.changedTouches).find(t => t.identifier === touchId);
                if (touch) onEnd();
            };
            window.addEventListener('touchend', handleTouchEnd);
            window.addEventListener('touchcancel', handleTouchEnd);
        }

        function checkWin() {
            const locked = document.querySelectorAll('.shape[data-locked="true"]');
            if (locked.length === roundShapes.length) {
                setTimeout(() => {
                    playWinSound();
                    fireConfetti();
                    if (nextCatUrl) {
                        catImg.src = nextCatUrl;
                    } else {
                        preloadNextCat();
                        catImg.src = nextCatUrl;
                    }
                    preloadNextCat();
                    successOverlay.classList.add('show');
                }, 500);
            }
        }

        resetBtn.addEventListener('click', initGame);

        initGame();
    </script>
</body>

</html>
