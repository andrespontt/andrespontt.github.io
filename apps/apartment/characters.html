<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apartment — Character studio</title>
<script type="importmap">{"imports":{"three":"../vendor/three.module.min.js"}}</script>
<style>
*{box-sizing:border-box}body{margin:0;background:#142024;color:#e8e5d6;font-family:Arial,sans-serif}canvas{position:fixed;inset:0;touch-action:none}header{position:fixed;top:28px;left:5%;right:5%;pointer-events:none}header small{font-size:10px;letter-spacing:3px;color:#d7e7a5}h1{font-family:Georgia,serif;font-size:32px;font-weight:400;margin:12px 0}header p{font-size:12px;color:#a4afa8}nav{position:fixed;bottom:28px;left:5%;right:5%;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}button,a{border:1px solid #e8e5d640;background:#142024cf;color:#e8e5d6;padding:12px 16px;font:12px Arial;text-decoration:none;cursor:pointer}button[aria-pressed=true]{background:#d7e7a5;color:#142024}#error{position:fixed;top:45%;left:10%;right:10%;background:#142024;padding:25px}
</style>
</head>
<body><canvas id="scene" aria-label="Rotating 3D character lineup"></canvas><header><small>APARTMENT / CHARACTER STUDIO</small><h1>The night shift.</h1><p>Hayes · The uninvited guest · Rivera</p><p>Drag to rotate · Scroll to zoom</p></header><nav><div><button id="idle" aria-pressed="true">On watch</button> <button id="walk" aria-pressed="false">Walking</button></div><a href="../apartment.html">Enter the apartment →</a></nav><p id="error" hidden></p>
<script type="module">
import * as THREE from 'three';
import {createCharacter,animateCharacter} from './characters.js';
try {
const scene=new THREE.Scene();scene.background=new THREE.Color('#142024');scene.fog=new THREE.Fog('#142024',10,24);
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('scene'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;renderer.shadowMap.enabled=true;
const camera=new THREE.PerspectiveCamera(38,1,.05,40);
scene.add(new THREE.HemisphereLight('#d8e7ee','#7c715a',2.4));
for(const [color,power,x,y,z] of [['#ffe2b4',4,-3,5,4],['#a6c9ed',3,4,3,-1]]){const light=new THREE.DirectionalLight(color,power);light.position.set(x,y,z);scene.add(light);}
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:'#19282c',roughness:.9}));floor.rotation.x=-Math.PI/2;floor.position.y=-.025;scene.add(floor);
const models=[createCharacter('guard'),createCharacter('clown'),createCharacter('guard',1)];models.forEach((model,i)=>{model.position.x=(i-1)*1.3;scene.add(model);const plinth=new THREE.Mesh(new THREE.CylinderGeometry(.47,.50,.05,48),new THREE.MeshStandardMaterial({color:'#34464a'}));plinth.position.set(model.position.x,-.025,0);scene.add(plinth);});
let angle=0,distance=7.1,drag=null,walking=false,last=0,time=0;
const canvas=renderer.domElement;
canvas.onpointerdown=e=>{drag=e.clientX;canvas.setPointerCapture(e.pointerId);};canvas.onpointermove=e=>{if(drag===null)return;angle+=(e.clientX-drag)*.007;drag=e.clientX;};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;
canvas.onwheel=e=>{e.preventDefault();distance=THREE.MathUtils.clamp(distance+e.deltaY*.005,4,11);};
for(const id of ['idle','walk'])document.getElementById(id).onclick=()=>{walking=id==='walk';document.getElementById('walk').setAttribute('aria-pressed',String(walking));document.getElementById('idle').setAttribute('aria-pressed',String(!walking));};
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}addEventListener('resize',resize);resize();
renderer.setAnimationLoop(now=>{const dt=Math.min((now-(last||now))/1000,.04);last=now;time+=dt;const viewDistance=distance*Math.max(1,1/camera.aspect);camera.position.set(Math.sin(angle)*viewDistance,2.4,Math.cos(angle)*viewDistance);camera.lookAt(0,1.1,0);models.forEach((model,i)=>{model.position.z=walking?time*1.5:0;animateCharacter(model,time,dt);model.position.z=0;});renderer.render(scene,camera);});
}catch(error){document.getElementById('error').hidden=false;document.getElementById('error').textContent='The character studio could not start. Reload with WebGL enabled.';console.error(error);}
</script></body></html>
