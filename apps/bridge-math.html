<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
  <title>Cat Bridge Math 🌉</title>
  <meta name="theme-color" content="#22c55e" />
  <link rel="manifest" href="bridge-math.webmanifest" />
  <style>
    :root {
      --sky-top: #4fb3ec;
      --sky-bottom: #dff3fd;
      --grass: #5fd07a;
      --grass-dark: #2f9e4f;
      --dirt: #8a5a2e;
      --dirt-dark: #5b3717;
      --wood: #c47a35;
      --wood-dark: #7c4318;
      --accent: #f59e0b;
      --accent-dark: #c2710c;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
    }
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0; height: 100%;
      font-family: 'Fredoka', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(180deg, var(--sky-top) 0%, #8fd3f6 55%, var(--sky-bottom) 100%);
      color: var(--text);
      display: flex; flex-direction: column;
      overflow: hidden;
      user-select: none; -webkit-user-select: none;
    }
    button, input { font-family: inherit; }

    /* Sky decorations */
    .sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .sun {
      position: absolute; top: 90px; right: 8%;
      width: 84px; height: 84px; border-radius: 50%;
      background: radial-gradient(circle, #fff7c2 0 45%, #fde047 46% 100%);
      box-shadow: 0 0 0 14px rgba(253, 224, 71, 0.25), 0 0 60px 20px rgba(253, 224, 71, 0.35);
    }
    .cloud {
      position: absolute; width: 120px; height: 36px;
      background: rgba(255, 255, 255, 0.92); border-radius: 40px;
      animation: drift 60s linear infinite;
    }
    .cloud::before, .cloud::after {
      content: ''; position: absolute; background: inherit; border-radius: 50%;
    }
    .cloud::before { width: 54px; height: 54px; left: 18px; top: -26px; }
    .cloud::after { width: 40px; height: 40px; left: 60px; top: -18px; }
    .c1 { top: 120px; left: -10%; animation-delay: -20s; }
    .c2 { top: 230px; left: -10%; transform: scale(0.7); animation-duration: 85s; animation-delay: -55s; opacity: 0.8; }
    .c3 { top: 170px; left: -10%; transform: scale(1.15); animation-duration: 110s; animation-delay: -85s; }
    @keyframes drift { to { left: 110%; } }
    .hills {
      position: absolute; left: 0; right: 0; bottom: 0; height: 26vh;
      background:
        radial-gradient(ellipse 40% 70% at 12% 100%, #7ed69a 0 98%, transparent 100%),
        radial-gradient(ellipse 45% 85% at 85% 100%, #86dca1 0 98%, transparent 100%),
        radial-gradient(ellipse 60% 55% at 50% 100%, #9be4b2 0 98%, transparent 100%);
    }

    header {
      position: relative; z-index: 10;
      padding: 10px 16px;
      padding-top: max(10px, env(safe-area-inset-top));
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      box-shadow: 0 2px 12px rgba(15, 23, 42, 0.08);
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    h1 {
      margin: 0; font-size: 24px; font-weight: 700; color: var(--accent-dark);
      display: flex; align-items: center; gap: 8px; white-space: nowrap;
    }
    .header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .back-link {
      color: var(--accent-dark); text-decoration: none; font-weight: 700; font-size: 20px;
      width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--accent);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      background: #fff;
    }
    .header-tools { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .tool-btn {
      display: inline-flex; align-items: center; gap: 6px;
      height: 36px; min-width: 36px; padding: 0 12px;
      border: 1px solid #e2e8f0; border-radius: 999px;
      background: #fff; color: var(--muted);
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .tool-btn:hover { border-color: #cbd5e1; color: var(--text); }
    .tool-btn.on { background: #dcfce7; border-color: #22c55e; color: #166534; }
    #secret-btn.on { background: #ccfbf1; border-color: #14b8a6; color: #115e59; }
    #music-toggle { justify-content: center; padding: 0; font-size: 18px; }
    #music-toggle.muted { opacity: 0.45; }

    .game-area {
      position: relative; z-index: 1;
      flex: 1; min-height: 0;
      display: flex; flex-direction: column; align-items: center;
      gap: 16px;
      padding: 16px 16px 0;
    }

    .equation-card {
      width: min(100%, 520px);
      background: var(--card);
      padding: 18px 28px 12px;
      border-radius: 28px;
      box-shadow: 0 6px 0 var(--accent-dark), 0 18px 40px rgba(15, 23, 42, 0.18);
      border: 4px solid var(--accent);
      text-align: center;
      margin-top: clamp(4px, 3vh, 32px);
      position: relative;
    }

    .progress {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      font-size: 14px; font-weight: 600; color: var(--muted);
      margin-bottom: 14px;
    }
    .pips { display: inline-flex; gap: 4px; }
    .pips i {
      width: 22px; height: 9px; border-radius: 3px;
      border: 2px dashed #cbd5e1; transition: background 0.3s, border-color 0.3s;
    }
    .pips i.on { background: var(--wood); border: 2px solid var(--wood-dark); }

    .equation {
      min-height: 64px;
      font-size: clamp(32px, 8vw, 48px);
      font-weight: 700;
      color: var(--text);
      display: flex; align-items: center; justify-content: center;
      gap: clamp(8px, 2.5vw, 16px);
    }
    .equation .op { color: var(--accent); }
    .equation.message { font-size: clamp(20px, 5vw, 28px); line-height: 1.25; }

    input[type="number"] {
      width: clamp(64px, 18vw, 84px);
      height: 64px;
      font-size: 36px; font-weight: 700;
      text-align: center;
      border: 3px dashed var(--accent);
      border-radius: 14px;
      outline: none;
      color: var(--text);
      background: #fffbeb;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
      -moz-appearance: textfield; appearance: textfield;
    }
    input[type="number"]:focus {
      border-style: solid;
      background: #fff;
      box-shadow: 0 0 0 5px rgba(245, 158, 11, 0.22);
    }
    input[type="number"]:disabled { border-color: #22c55e; border-style: solid; background: #f0fdf4; }
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

    .btn {
      margin-top: 16px;
      padding: 12px 28px;
      font-size: 20px; font-weight: 700;
      background: var(--accent); color: white;
      border: none; border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--accent-dark);
      transition: transform 0.1s, box-shadow 0.1s, opacity 0.2s;
    }
    .btn:hover { filter: brightness(1.05); }
    .btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--accent-dark); }
    .btn:disabled { opacity: 0.55; cursor: default; transform: none; filter: none; }
    .btn:focus-visible, .tool-btn:focus-visible, .back-link:focus-visible {
      outline: 3px solid #2563eb; outline-offset: 2px;
    }

    .feedback {
      min-height: 26px;
      margin-top: 8px;
      font-size: 18px; font-weight: 600;
    }
    .good { color: #15803d; }
    .bad { color: #b91c1c; }

    /* Scene */
    .scene {
      position: relative;
      width: 100%; max-width: 800px;
      height: clamp(200px, 36vh, 320px);
      margin-top: auto;
      display: flex; align-items: flex-end;
    }
    .cliff {
      width: 20%; height: 55%;
      position: relative; z-index: 2;
      border-top: 10px solid var(--grass);
      background:
        radial-gradient(circle at 30% 30%, rgba(0, 0, 0, 0.12) 0 4px, transparent 5px) 0 0 / 38px 34px,
        radial-gradient(circle at 70% 70%, rgba(255, 255, 255, 0.08) 0 5px, transparent 6px) 0 0 / 46px 40px,
        linear-gradient(180deg, var(--dirt) 0%, var(--dirt-dark) 100%);
    }
    /* Darker grass lip under the grass edge */
    .cliff::before {
      content: ''; position: absolute; left: 0; right: 0; top: 0; height: 5px;
      background: var(--grass-dark); opacity: 0.55;
    }
    .scene > .cliff:first-of-type { border-top-right-radius: 8px; box-shadow: inset -6px 0 0 rgba(0, 0, 0, 0.12); }
    .scene > .cliff:last-of-type { border-top-left-radius: 8px; box-shadow: inset 6px 0 0 rgba(0, 0, 0, 0.12); }

    .gap { width: 60%; height: 55%; position: relative; z-index: 3; }

    .water {
      position: absolute; left: 20%; bottom: 0;
      width: 60%; height: 26%;
      background: linear-gradient(180deg, #38bdf8 0%, #0e7490 100%);
      z-index: 1; overflow: hidden;
    }
    .water.salty { background: linear-gradient(180deg, #2dd4bf 0%, #0891b2 100%); }
    /* Wave crest and drifting sparkles */
    .water::before {
      content: ''; position: absolute; left: 0; right: 0; top: 0; height: 10px;
      background: radial-gradient(circle at 12px 14px, transparent 0 9px, rgba(224, 242, 254, 0.85) 10px 12px, transparent 13px) 0 0 / 24px 10px repeat-x;
      animation: waves 3s linear infinite;
    }
    .water::after {
      content: ''; position: absolute; inset: 12px 0 0;
      background:
        radial-gradient(ellipse 18px 4px at 20% 40%, rgba(255, 255, 255, 0.35) 98%, transparent),
        radial-gradient(ellipse 14px 3px at 60% 70%, rgba(255, 255, 255, 0.3) 98%, transparent),
        radial-gradient(ellipse 20px 4px at 85% 35%, rgba(255, 255, 255, 0.3) 98%, transparent);
      animation: shimmer 4s ease-in-out infinite alternate;
    }
    @keyframes waves { to { background-position: 24px 0; } }
    @keyframes shimmer { to { transform: translateX(14px); opacity: 0.6; } }

    .bridge {
      position: absolute; top: -10px; left: 0;
      width: 100%; height: 20px;
      display: flex; gap: 3px; padding: 0 2px;
    }
    /* Empty slot: shows where the next plank goes */
    .plank {
      flex: 1; height: 100%;
      border: 2px dashed rgba(255, 255, 255, 0.85);
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.18);
    }
    .plank.show {
      border: none;
      border-bottom: 4px solid var(--wood-dark);
      background:
        repeating-linear-gradient(180deg, transparent 0 5px, rgba(0, 0, 0, 0.08) 5px 6px),
        linear-gradient(180deg, #d98d45 0%, var(--wood) 100%);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.18);
      animation: drop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
    }
    @keyframes drop {
      0% { opacity: 0; transform: translateY(-50px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .cat {
      position: absolute; top: -60px; left: 10px;
      font-size: 50px;
      transition: transform 0.9s linear;
      z-index: 5;
      transform: scaleX(-1);
      filter: drop-shadow(0 4px 2px rgba(0, 0, 0, 0.25));
    }

    #confetti {
      position: fixed; inset: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 100; display: none;
    }

    .modal {
      position: fixed; inset: 0;
      background: rgba(15, 23, 42, 0.55);
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
      z-index: 200;
      visibility: hidden; opacity: 0;
      transition: opacity 0.3s, visibility 0.3s;
    }
    .modal.show { visibility: visible; opacity: 1; }
    .modal-content {
      width: min(100%, 420px);
      background: white; padding: 32px 24px 24px;
      border-radius: 28px; border: 4px solid var(--accent);
      text-align: center;
      box-shadow: 0 6px 0 var(--accent-dark), 0 20px 50px rgba(0, 0, 0, 0.3);
      transform: scale(0.92); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .modal.show .modal-content { transform: scale(1); }
    .modal h2 { margin: 0 0 8px; font-size: 32px; color: var(--accent-dark); }
    #modal-msg { font-size: 20px; margin: 0 0 8px; color: var(--muted); }
    .reward-cat {
      width: 200px; height: 200px; object-fit: cover;
      border-radius: 16px; margin: 12px 0; border: 4px solid var(--accent);
      background: #fef3c7;
    }
    .modal .btn { width: 100%; }

    @media (max-width: 600px) {
      header { padding-left: 12px; padding-right: 12px; }
      h1 { font-size: 18px; gap: 6px; }
      h1 > span:first-child { display: none; }
      .header-tools { gap: 4px; }
      .header-left { gap: 8px; }
      .tool-label { display: none; }
      .tool-btn { justify-content: center; padding: 0; font-size: 16px; }
      .equation-card { padding: 14px 16px 10px; border-radius: 24px; }
      .sun { width: 60px; height: 60px; top: 76px; right: 6%; }
    }
    @media (max-width: 360px) {
      .title-text { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cloud, .water::before, .water::after { animation: none; }
    }
  </style>

<body>

  <div class="sky" aria-hidden="true">
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="hills"></div>
  </div>

  <header>
    <div class="header-left">
      <a href="index.html" class="back-link" title="Back to Apps" aria-label="Back to Apps">←</a>
      <h1><span aria-hidden="true">🌉</span><span class="title-text">Cat Bridge Math</span></h1>
    </div>
    <div class="header-tools">
      <button id="music-toggle" class="tool-btn" title="Toggle music" aria-label="Toggle music" aria-pressed="true"><span aria-hidden="true">🎵</span></button>
      <button id="debug-toggle" class="tool-btn" title="Toggle debug mode" aria-pressed="false"><span aria-hidden="true">🐞</span><span class="tool-label">Debug</span></button>
      <button id="secret-btn" class="tool-btn" title="Secret mode"><span class="tool-icon" aria-hidden="true">🔒</span><span class="tool-label">Secret</span></button>
      <button id="reset-page" class="tool-btn" title="Reset game"><span aria-hidden="true">↺</span><span class="tool-label">Reset</span></button>
    </div>
  </header>

  <div class="game-area">
    <div class="equation-card">
      <div class="progress">
        <span class="pips" id="pips" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <span><span id="progress">0</span> / 5 planks</span>
      </div>
      <div id="equation" class="equation">
        <!-- Equation goes here -->
      </div>
      <button class="btn" id="check-btn" onclick="checkAnswer()">Build Plank 🔨</button>
      <div class="feedback" id="feedback"></div>
    </div>
    
    <div class="scene">
      <div class="water" id="water" aria-hidden="true"></div>
      <div class="cliff">
        <div class="cat" id="cat">🐈</div>
      </div>
      <div class="gap">
        <div class="bridge" id="bridge">
          <!-- 5 Planks -->
          <div class="plank"></div>
          <div class="plank"></div>
          <div class="plank"></div>
          <div class="plank"></div>
          <div class="plank"></div>
        </div>
      </div>
      <div class="cliff"></div>
    </div>
  </div>

  <canvas id="confetti"></canvas>
  
  <div class="modal" id="win-modal">
    <div class="modal-content">
      <h2 id="modal-title">You Did It! 🏆</h2>
      <p id="modal-msg">The cat safely crossed the bridge.</p>
      <img src="https://cataas.com/cat/gif" alt="Happy Cat" class="reward-cat" style="display:none;" id="reward-cat" />
      <button class="btn" onclick="resetGame()" style="width: 100%">Play Again ↺</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://unpkg.com/midi-player-js@2.0.16/build/index.browser.js"></script>
  <script>
    const TOTAL_PLANKS = 5;
    const CAT_STEP_MS = 20000;
    const DEBUG_CAT_STEP_MS = 1000;
    const CAT_BASE_LEFT = 10;
    let earnedPlanks = 0;
    let currentAnswer = 0;
    let catStep = 0;
    let walkTimer = null;
    let gameState = 'playing';
    let debugMode = false;
    let snailMode = false;
    
    // --- Audio System ---
    let musicEnabled = true;
    let audioCtx = null;
    let masterGain = null;
    let midiPlayer = null;
    let activeOscillators = {};
    let hasInteracted = false;

    function initAudio() {
      if (audioCtx) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
      
      // Resume AudioContext synchronously during user gesture!
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.05; // lower retro volume
      masterGain.connect(audioCtx.destination);

      midiPlayer = new MidiPlayer.Player(function(event) {
        if (!musicEnabled) return;
        if (event.name === 'Note on' && event.velocity > 0) {
          const osc = audioCtx.createOscillator();
          osc.type = 'square'; // retro 8-bit tetris feel
          osc.frequency.value = 440 * Math.pow(2, (event.noteNumber - 69) / 12);
          osc.connect(masterGain);
          osc.start();
          activeOscillators[event.noteNumber] = osc;
        } else if (event.name === 'Note off' || (event.name === 'Note on' && event.velocity === 0)) {
          if (activeOscillators[event.noteNumber]) {
            activeOscillators[event.noteNumber].stop();
            activeOscillators[event.noteNumber].disconnect();
            delete activeOscillators[event.noteNumber];
          }
        }
      });

      midiPlayer.on('endOfFile', () => {
        if(musicEnabled) {
          midiPlayer.play(); // Loop
        }
      });

      fetch('../assets/songs/tetris.mid')
        .then(response => response.arrayBuffer())
        .then(data => {
            midiPlayer.loadArrayBuffer(data);
            if (musicEnabled) {
              midiPlayer.play();
            }
        });
    }

    const ui = {
      eq: document.getElementById('equation'),
      feedback: document.getElementById('feedback'),
      progress: document.getElementById('progress'),
      planks: document.querySelectorAll('.plank'),
      pips: document.querySelectorAll('#pips i'),
      cat: document.getElementById('cat'),
      water: document.getElementById('water'),
      scene: document.querySelector('.scene'),
      modal: document.getElementById('win-modal'),
      modalTitle: document.getElementById('modal-title'),
      modalMsg: document.getElementById('modal-msg'),
      rewardCat: document.getElementById('reward-cat'),
      checkBtn: document.getElementById('check-btn'),
      musicToggle: document.getElementById('music-toggle'),
      debugToggle: document.getElementById('debug-toggle'),
      secretBtn: document.getElementById('secret-btn'),
      resetPage: document.getElementById('reset-page')
    };

    function getCatStepMs() {
      return debugMode ? DEBUG_CAT_STEP_MS : CAT_STEP_MS;
    }

    function getAnswerDelayMs() {
      return debugMode ? 120 : 1000;
    }

    function applyCharacterMode() {
      ui.cat.textContent = snailMode ? '🐌' : '🐈';
      ui.water.classList.toggle('salty', snailMode);
      ui.secretBtn.querySelector('.tool-icon').textContent = snailMode ? '🐌' : '🔒';
      ui.secretBtn.querySelector('.tool-label').textContent = snailMode ? 'Snail' : 'Secret';
      ui.secretBtn.classList.toggle('on', snailMode);
    }

    function setProgress(count) {
      ui.progress.textContent = count;
      ui.pips.forEach((pip, i) => pip.classList.toggle('on', i < count));
    }

    // Short status text (not an equation) in the card.
    function showMessage(text) {
      ui.eq.textContent = text;
      ui.eq.classList.add('message');
    }

    function stopCatWalk() {
      if (!walkTimer) return;
      clearTimeout(walkTimer);
      walkTimer = null;
    }

    function catWidthPx() {
      const w = ui.cat.getBoundingClientRect().width;
      return w > 0 ? w : 50;
    }

    function catStepToX(step) {
      const sceneWidth = ui.scene.offsetWidth;
      const leftCliffWidth = sceneWidth * 0.2;
      const gapWidth = sceneWidth * 0.6;
      const rightCliffWidth = sceneWidth * 0.2;
      const plankWidth = gapWidth / TOTAL_PLANKS;
      const catW = catWidthPx();

      if (step <= 0) return 0;
      if (step <= TOTAL_PLANKS) {
        const leftAbs = leftCliffWidth + (step - 0.5) * plankWidth - catW * 0.5;
        return Math.round(leftAbs - CAT_BASE_LEFT);
      }
      const leftAbs = leftCliffWidth + gapWidth + rightCliffWidth * 0.18 - catW * 0.5;
      return Math.round(leftAbs - CAT_BASE_LEFT);
    }

    function catFallTriggerX(missingStep) {
      const sceneWidth = ui.scene.offsetWidth;
      const leftCliffWidth = sceneWidth * 0.2;
      const gapWidth = sceneWidth * 0.6;
      const plankWidth = gapWidth / TOTAL_PLANKS;
      const catW = catWidthPx();
      const supportEndAbs =
        missingStep === 1
          ? leftCliffWidth
          : leftCliffWidth + (missingStep - 1) * plankWidth;
      // Half body past the support edge before falling.
      const leftAbs = supportEndAbs - catW * 0.5 + 4;
      return Math.round(leftAbs - CAT_BASE_LEFT);
    }

    function updateCatPosition(step) {
      const x = catStepToX(step);
      ui.cat.style.transition = 'none';
      ui.cat.style.transform = `translateX(${x}px) scaleX(-1)`;
    }

    function showEndModal(title, message, showRewardCat) {
      ui.modalTitle.textContent = title;
      ui.modalMsg.textContent = message;
      ui.modal.classList.add('show');
      if (showRewardCat) {
        ui.rewardCat.src = `https://cataas.com/cat/gif?t=${Date.now()}`;
        ui.rewardCat.style.display = 'inline-block';
      } else {
        ui.rewardCat.style.display = 'none';
      }
    }

    function wetSequence(fallX) {
      if (gameState !== 'playing') return;
      gameState = 'lost';
      stopCatWalk();
      ui.checkBtn.disabled = true;
      ui.feedback.textContent = snailMode ? 'Game over salty snail' : 'Splash! No plank there. Game over.';
      ui.feedback.className = 'feedback bad';
      showMessage(snailMode ? 'Salty water got the snail! 🧂🐌' : 'The cat got wet! 💦');
      ui.cat.style.transition = 'transform 0.45s ease-in';
      ui.cat.style.transform = `translateX(${fallX}px) translateY(65px) scaleX(-1)`;
      if (midiPlayer) {
        midiPlayer.pause();
      }
      setTimeout(() => {
        if (snailMode) {
          showEndModal('Splash... 🐌', 'game over salty snail', false);
          return;
        }
        showEndModal('Splash... 😿', 'The cat stepped into water because a plank was missing.', false);
      }, 500);
    }

    function walkToNextStep() {
      if (gameState !== 'playing') return;
      const nextStep = catStep + 1;
      const x = nextStep <= TOTAL_PLANKS ? catFallTriggerX(nextStep) : catStepToX(nextStep);
      const stepMs = getCatStepMs();
      ui.cat.style.transition = `transform ${stepMs}ms linear`;
      ui.cat.style.transform = `translateX(${x}px) scaleX(-1)`;

      walkTimer = setTimeout(() => {
        if (gameState !== 'playing') return;
        const hasPlank = nextStep > TOTAL_PLANKS || ui.planks[nextStep - 1].classList.contains('show');
        if (!hasPlank) {
          wetSequence(x);
          return;
        }
        catStep = nextStep;
        if (nextStep <= TOTAL_PLANKS) {
          // Nudge onto the plank center after reaching edge-crossing point.
          ui.cat.style.transition = 'transform 0.25s ease-out';
          ui.cat.style.transform = `translateX(${catStepToX(catStep)}px) scaleX(-1)`;
        }
        if (catStep >= TOTAL_PLANKS + 1) {
          winSequence();
          return;
        }
        walkTimer = setTimeout(() => {
          walkToNextStep();
        }, nextStep <= TOTAL_PLANKS ? 250 : 0);
      }, stepMs);
    }

    function startCatWalk() {
      stopCatWalk();
      walkToNextStep();
    }

    ui.musicToggle.addEventListener('click', () => {
      musicEnabled = !musicEnabled;
      ui.musicToggle.classList.toggle('muted', !musicEnabled);
      ui.musicToggle.setAttribute('aria-pressed', String(musicEnabled));
      if (!musicEnabled && midiPlayer) {
        midiPlayer.pause();
        // Stop dangling notes
        Object.values(activeOscillators).forEach(osc => {
          osc.stop(); osc.disconnect();
        });
        activeOscillators = {};
      } else if (musicEnabled && midiPlayer) {
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        midiPlayer.play();
      }
    });

    ui.debugToggle.addEventListener('click', () => {
      debugMode = !debugMode;
      ui.debugToggle.classList.toggle('on', debugMode);
      ui.debugToggle.setAttribute('aria-pressed', String(debugMode));
      resetGame();
    });

    ui.resetPage.addEventListener('click', () => {
      window.location.reload();
    });

    ui.secretBtn.addEventListener('click', () => {
      const code = window.prompt('Enter secret word');
      if (code === null) return;
      if (code.trim().toLowerCase() === 'snail') {
        snailMode = true;
        applyCharacterMode();
        ui.feedback.textContent = 'Secret unlocked: snail mode.';
        ui.feedback.className = 'feedback good';
        return;
      }
      ui.feedback.textContent = 'No secret unlocked.';
      ui.feedback.className = 'feedback bad';
    });

    document.addEventListener('click', () => {
      if (!hasInteracted) {
        hasInteracted = true;
        if (musicEnabled) {
          initAudio();
        }
      }
    }, { once: true });

    function rng(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateEquation() {
      ui.feedback.textContent = '';
      ui.feedback.className = 'feedback';
      
      // 0: a + b = c (25%)
      // 1: a - b = c (25%)
      // 2 or 3: a + b = c + d (50%)
      const type = rng(0, 3); 
      let terms = [];
      let ops = [];
      
      if (type === 0) { 
        let a = rng(1, 9);
        let b = rng(1, 10 - a); 
        let c = a + b;
        terms = [a, b, c];
        ops = ['+', '='];
      } else if (type === 1) { 
        let a = rng(2, 10);
        let b = rng(1, a - 1);
        let c = a - b;
        terms = [a, b, c];
        ops = ['-', '='];
      } else { 
        // a + b = c + d
        let sum = rng(4, 10);
        let a = rng(1, sum - 1);
        let b = sum - a;
        let c = rng(1, sum - 1);
        let d = sum - c;
        terms = [a, b, c, d];
        ops = ['+', '=', '+'];
      }
      
      // Select hidden term
      const hiddenIdx = rng(0, terms.length - 1);
      currentAnswer = terms[hiddenIdx];
      
      // Render
      ui.eq.innerHTML = '';
      ui.eq.classList.remove('message');
      for (let i = 0; i < terms.length; i++) {
        if (i === hiddenIdx) {
          const inp = document.createElement('input');
          inp.type = 'number';
          inp.id = 'answer-input';
          inp.setAttribute('pattern', '[0-9]*');
          inp.setAttribute('inputmode', 'numeric');
          ui.eq.appendChild(inp);
          
          inp.addEventListener('click', () => {
            if(!hasInteracted) {
                hasInteracted = true;
                if(musicEnabled) initAudio();
            }
          });

          setTimeout(() => inp.focus(), 100);
          
          inp.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') checkAnswer();
          });

          if (debugMode) {
            inp.value = String(currentAnswer);
            setTimeout(() => {
              if (gameState !== 'playing') return;
              checkAnswer();
            }, 90);
          }
        } else {
          const span = document.createElement('span');
          span.textContent = terms[i];
          ui.eq.appendChild(span);
        }
        
        if (i < terms.length - 1) {
          const opSpan = document.createElement('span');
          opSpan.className = 'op';
          opSpan.textContent = ops[i] === '-' ? '−' : ops[i];
          ui.eq.appendChild(opSpan);
        }
      }
    }

    function checkAnswer() {
      if (gameState !== 'playing') return;
      const inp = document.getElementById('answer-input');
      if (!inp || inp.value === '') return;
      
      const val = parseInt(inp.value, 10);
      if (val === currentAnswer) {
        // Correct!
        ui.feedback.textContent = 'Correct! 🔨';
        ui.feedback.className = 'feedback good';
        
        // Disable input briefly
        inp.disabled = true;
        ui.checkBtn.disabled = true;
        
        // Add plank
        if (earnedPlanks < TOTAL_PLANKS) {
          ui.planks[earnedPlanks].classList.add('show');
          earnedPlanks++;
          setProgress(earnedPlanks);
        }
        
        if (earnedPlanks >= TOTAL_PLANKS) {
          ui.feedback.textContent = 'All planks ready - keep going kitty!';
          ui.feedback.className = 'feedback good';
          showMessage('Bridge is fully built. Cat is crossing…');
          return;
        }
        setTimeout(() => {
          if (gameState !== 'playing') return;
          generateEquation();
          ui.checkBtn.disabled = false;
        }, getAnswerDelayMs());
      } else {
        // Incorrect
        ui.feedback.textContent = 'Oops, try again! 🤔';
        ui.feedback.className = 'feedback bad';
        inp.value = '';
        inp.focus();
      }
    }

    function winSequence() {
      if (gameState !== 'playing') return;
      gameState = 'won';
      stopCatWalk();
      ui.feedback.textContent = '';
      showMessage('Bridge Complete! 🌉');
      ui.checkBtn.style.display = 'none';
      if (midiPlayer) {
          midiPlayer.pause();
          Object.values(activeOscillators).forEach(osc => { osc.stop(); osc.disconnect(); });
          activeOscillators = {};
      }
      
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 }
      });
      showEndModal('You Did It! 🏆', 'The cat safely crossed the bridge.', true);
    }

    function resetGame() {
      stopCatWalk();
      gameState = 'playing';
      earnedPlanks = 0;
      catStep = 0;
      setProgress(earnedPlanks);
      ui.planks.forEach(p => p.classList.remove('show'));
      ui.cat.style.transform = `translateX(0px) scaleX(-1)`;
      ui.checkBtn.style.display = '';
      ui.checkBtn.disabled = false;
      ui.modal.classList.remove('show');
      ui.rewardCat.style.display = 'none';
      applyCharacterMode();
      generateEquation();
      updateCatPosition(catStep);
      startCatWalk();
      if(musicEnabled && midiPlayer) {
          midiPlayer.play();
      }
    }

    // Init
    resetGame();
    window.addEventListener('resize', () => updateCatPosition(catStep));

    // Register PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('bridge-math-sw.js');
      });
    }
  </script>
</body>
</html>
